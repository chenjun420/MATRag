      - iec_61204_3_ripple_emc        # IEC 61204-3 EMC 要求 (DC output)
      - iec_61204_ripple              # IEC 61204 generic 纹波测试
      - jeita_rc9131a_ripple          # JEITA-RC9131A 标准测量方法
      - en_61204_3_ripple             # EN IEC 61204-3 (欧洲等同采用)
    references:
      - "https://webstore.ansi.org/preview-pages/IEC/preview_iec61204-3%7Bed3.0%7Db.pdf"
      - "https://www.us.lambda.tdk.com/resources/blogs/20081121.html"
      - "https://standards.iteh.ai/catalog/standards/clc/32a2fa75-b35a-410b-83c7-c2f70dea2218/en-iec-61204-3-2018"

