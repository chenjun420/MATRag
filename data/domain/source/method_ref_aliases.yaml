# MATRag internal method_id (M-*) <-> external standard refs (iec*/en*/gb*/vendor_*)
#
# 数据来源 (2026-10-19 多路 websearch verified)
# ----------------------------------------
# - v1 (2026-10-18): stub - 仅 schema, 无数据
# - v2 (2026-10-19): 6 条 M-* 实填, 来源 TAVILY + EXA websearch
# - v3 (2026-10-19): 扩到 14 条 M-* (dynamics/safety/protection/input 轴)
# - v4 (2026-10-19): 结构化修复 + 扩到 25 条
#     * 结构: 此前 `version:` 顶层键与顶层序列混排 → yaml.safe_load 报错,
#       load_method_ref_aliases() 实际返回空映射 (降级留痕)。本版改为
#       `version:` + `aliases:` dict, 与 loader schema (data["aliases"]) 一致。
#     * 新增 5 条: M-STARTUP-TIME / M-OVERSHOOT / M-CROSS-REG / M-OTP / M-BURN-IN
#     * 补齐 standards 非空但缺条目的 6 条: M-SCP / M-GROUND-BOND /
#       M-TOUCH-CURRENT / M-INPUT-SLOW / M-OPP / M-TELEMETRY
#
# Provenance 约定
# ---------------
# external_ref id 格式: <standard_series>_<topic>  全小写 hyphen-separated
# 例: iec_61204_ripple / iec_62368_1_hipot / etsi_en_303470_efficiency
# 新引入 id 必须附可核实 URL (见各条 references); 优先复用本文件既有 id 词表。
#
# 命名空间约定 (与 A.1 #2 设计):
# - M-* 与 external_ref 命名空间设计上不相交 (内部方法 vs 外部标准溯源)
# - 本表是 RAG 召回阶段的桥, 让 "M-RIPPLE-NOISE" 与 "iec_61204_ripple"
#   互相承认对方指的是同一件事。
#
# 加载入口
# --------
# matrag.domain.test_methods.load_method_ref_aliases()        返回 dict[str, tuple[external_ref, ...]]
# matrag.domain.test_methods.build_reverse_aliases()           推导反向 external_ref -> [M-*, ...]
# matrag.domain.test_methods.resolve_external_refs_for(M-XXX)  返回 tuple[external_ref, ...]
# matrag.domain.test_methods.resolve_methods_by_external_ref(ext_ref)  返回 tuple[M-XXX, ...]

version: 4

aliases:

