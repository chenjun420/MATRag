- method_id: M-TOUCH-CURRENT
  zh: 接触电流(漏电流)测试
  en: Touch Current (Leakage Current) Test
  aliases: [漏电流测试, 接触电流测试]
  category: safety
  definition: 在被测电源正常状态与单一故障状态下, 测量流经可触及部件的接触电流, 验证人身安全。
  parameters:
    - 状态：正常 + 单一故障（开地等）
    - 极性：正接/反接各测
    - 频率：最不利条件
  instruments:
    - 接触电流测试仪（内置 IEC 60990 加权测量网络）
    - 隔离变压器/可调压电源
  interfaces:
    - 测量网络串接于可触及部件与地之间
    - 由转换开关切换网络类型
    - 样机输入接隔离电源
  metrics:
    - 接触电流（mA，峰值/有效值，≤限值）
    - 保护导体电流（mA）
  procedure:
    - 在正常状态与单一故障状态（开地/断开某一路）下分别测量;
    - 在输入极性反转下各测一次（整流滤波充电峰值对读数有影响）;
    - 使用最不利的电压/频率条件; 记录峰值与有效值。
  criteria:
    - 正常/单一故障（极性反转）条件下接触电流均在限值内（K-SAF-107）;
    - Y 电容容值上限由漏电流限值反推 C = I_leak/(2π·f·V)（K-SAF-104）。
  measures: [T-TOUCHCURR, T-YCAP]
  rules: [K-SAF-107, K-SAF-104]
  standards: [IEC 62368-1]
  references:
    - https://www.eet-china.com/mp/a119666.html
    - https://zhuanlan.zhihu.com/p/481833370
  retrieved: "2026-10-12"

- method_id: M-EFFICIENCY
  zh: 效率测试
  en: Efficiency Test
  aliases: [效率测试, 转换效率测试]
  category: efficiency
  definition: 在额定输入与多个负载点测量输入/输出功率, 计算转换效率 η = P_out/P_in × 100%, 并测空载输入功率。
  parameters:
    - 输入：115Vac/60Hz、230Vac/50Hz 等规定条件
    - 负载：25%/50%/75%/100%（+空载）
    - 预热：30min
  instruments:
    - 功率分析仪（电压/电流通道同步采样，精度 ≤0.1~0.5%）
    - 可编程交流源
    - 电子负载
  interfaces:
    - 输入经功率分析仪电压/电流通道接样机
    - 输出接功率分析仪直流通道与电子负载
  metrics:
    - 效率 η（%，各负载点）
    - 平均效率（能效等级）
    - 空载输入功率（W）
    - 功率因数 PF
  procedure:
    - 用功率分析仪（电压/电流通道同步采样）接入输入侧; 输出侧接电子负载;
    - 在 25%/50%/75%/100% 负载点分别记录 P_out 与 P_in;
    - 计算各点效率 η=P_out/P_in×100%; 另测空载（轻载）输入功率;
    - 负载变化引起输入压降时须补偿, 保持输入电压稳定后读数。
  criteria:
    - η = P_out/P_in × 100%（K-PWR-001）; 四负载点测试方法（K-PWR-118）;
    - 功率分析仪通道须同步采样, 仪器精度 ≤ 规格要求（K-PWR-119）;
    - 空载输入功率 ≤ 规格值（模块电源典型 0.3~0.5W）（K-PWR-120）;
    - P_out ≤ P_in 功率平衡自检（K-PWR-121）。
  measures: [T-EFFICIENCY, T-LOSS, T-NOLOADPWR, T-PF]
  rules: [K-PWR-001, K-PWR-118, K-PWR-119, K-PWR-120, K-PWR-121]
  standards: [IEC 61204]
  references:
    - https://blog.csdn.net/huxyc/article/details/126152207
    - https://zhuanlan.zhihu.com/p/591748436
    - https://bbs.eeworld.com.cn/thread-1328739-1-1.html
  retrieved: "2026-10-12"

- method_id: M-REGULATION
  zh: 调整率测试(负载/线性)
  en: Load and Line Regulation Test
  aliases: [负载调整率测试, 线性调整率测试, 电压调整率测试]
  category: output
  definition: 输入电压变化（线性调整率）或负载变化（负载调整率）时, 测量输出电压的偏离幅度。
  parameters:
    - 线性：输入从最低到最高（如 90~264Vac）
    - 负载：10%→100%
    - 多路：逐路加载测交叉
  instruments:
    - 数字万用表（6½ 位）/功率分析仪
    - 可编程交流源
    - 电子负载
  interfaces:
    - 输出端子接电子负载
    - 万用表经开尔文（远端感测）接输出端子
    - 输入接可编程源
  metrics:
    - 线性调整率（%/mV）
    - 负载调整率（%）
    - 交叉调整率（%）
    - 输出精度（±%读数+%FS）
  procedure:
    - 线性调整率：负载恒定, 输入从最低到最高（如 90~264Vac）变化, 记录 V_max/V_min, 按 (V_max−V_min)/V_nom×100% 计算;
    - 负载调整率：输入恒定, 负载 10%→100% 变化, 记录 V_空载与 V_满载差, 除以标称;
    - 多路电源另测交叉调整率（其他路负载变化时本路输出变化）;
    - 稳定后读数, 记录测试条件。
  criteria:
    - 线性/负载调整率 ≤ 规格限值（商用典型 0.1%~1%, 工业级 ≤0.5%）（K-PWR-110/111）;
    - 输出精度叠加读数+满量程带（模块电源典型 ±(0.5~1)% 读数 + ±0.5% FS）（K-PWR-112）。
  measures: [T-LOADREG, T-LINEREG, T-OUTACC, T-CROSSREG]
  rules: [K-PWR-110, K-PWR-111, K-PWR-112]
  standards: [IEC 61204]
  references:
    - https://b2bwiki.baidu.com/article/d0r1kf9ftjsv1cjnbi0g
    - https://modelers.csdn.net/69a50b2f7bbde9200b9aceec.html
  retrieved: "2026-10-12"

- method_id: M-TRANSIENT
  zh: 动态响应测试
  en: Load and Line Transient Response Test
  aliases: [动态响应测试, 负载瞬态测试, 过冲恢复测试]
  category: dynamics
  definition: 施加负载电流阶跃（或输入电压阶跃）, 测量输出电压的偏移幅度与恢复时间。
  parameters:
    - 负载阶跃：25%↔50%↔25%、50%↔75%↔50%
    - 斜率：典型 2.5A/µs
    - 周期：20ms/占空 50%
    - 输入/温度：高低限与温度极值
  instruments:
    - 电子负载（动态模式，斜率与周期可编程；rise time 快于被测 5 倍）
    - 示波器（Sample/Hi-Res 模式）
  interfaces:
    - 输出端子 V+/V− 接电子负载
    - 示波器经短地线/同轴靠接输出端（20MHz 带宽限制）
  metrics:
    - 输出电压偏移幅度（±%·Vout）
    - 恢复时间（µs，回到恢复带）
    - 输入瞬态偏移（±%）
  procedure:
    - 电子负载动态模式：负载电流按 25%↔50%↔25%（或 50%↔75%↔50%）额定值阶跃, 斜率典型 2.5A/µs, 周期约 20ms;
    - 示波器以 Sample/Hi-res 模式记录输出电压波形（保持稳压过程）;
    - 读取最大偏移幅度与恢复时间（回到恢复带并保持稳定所需时间）;
    - 在输入高/低限、温度极值等工况复测; 输入瞬态按输入电压阶跃同法测量。
  criteria:
    - 恢复时间 ≤200µs 时输出超调 ≤±5%·Vout; >200µs 时 ≤ 负载调整率（±0.5%）级（K-PWR-106/107）;
    - 输入瞬态下输出偏移 ≤±2%, 恢复时间 ≤100µs（K-PWR-108）;
    - 电子负载的 rise time 须至少比被测电源快 5 倍, 否则负载能力成为限制项（K-FIX-019）。
  measures: [T-TRANSIENT, T-LINETRANSIENT, T-STARTOVERSHOOT]
  rules: [K-PWR-106, K-PWR-107, K-PWR-108, K-FIX-019]
  standards: [IEC 61204]
  references:
    - https://www.dianyuan.com/article/46903.html
    - https://www.analog.com/cn/resources/technical-articles/line-and-load-transient-testing-for-power-supplies.html
    - https://blog.csdn.net/weixin_37623660/article/details/145145618
  retrieved: "2026-10-12"

- method_id: M-STARTUP
  zh: 启动特性测试(延迟/上升时间/过冲)
  en: Start-up Characteristics Test
  aliases: [启动测试, 上升时间测试, 开机延迟测试]
  category: dynamics
  definition: 在预定带载条件下接通输入, 检测电源启动延迟、输出上升时间与启动过冲, 并观察输入浪涌电流。
  parameters:
    - 负载模式：CC/CR/CP
    - 输入：接通（含最低/额定输入）
    - 记录：延迟/上升/过冲
  instruments:
    - 示波器（多通道，配电流探头）
    - 电子负载（CC/CR/CP）
    - 可编程交流源
  interfaces:
    - 输入电压波形 CH1（经差分探头或隔离）
    - 输出上升波形 CH2
    - PG/PGOOD 信号（如具备）CH3 监测
    - 输入电流经电流探头
  metrics:
    - 开机延迟时间（ms）
    - 输出电压上升时间（ms，10%~90%）
    - 启动过冲（±%·Vout）
    - PG 建立延时（相对输出达稳, 如具备）
  procedure:
    - 电子负载以 CC/CR/CP 模式带载（CR 模式对电源最温和, CP 最严酷）;
    - 接通输入, 用示波器（配合电流探头）记录输出上升波形与输入电流波形;
    - 记录开机延迟时间（接通至输出开始上升）、上升时间（升至额定）、启动过冲幅度;
    - 记录 PG/PGOOD（如具备）相对输出建立的翻转时序, 与序列要求比对;
    - 观察输入浪涌电流是否构成破坏性影响。
  criteria:
    - 软启动限制输出浪涌, 启动过冲 ≤1~5%·Vout, 启动时间符合规格（K-PWR-109）。
  measures: [T-STARTUPTIME, T-RISETIME, T-SOFTSTART, T-STARTOVERSHOOT, T-PGOOD]
  rules: [K-PWR-109]
  standards: [IEC 61204]
  references:
    - http://www.jartul.com/te_service_method_copy/0/0.chtml
    - https://zhuanlan.zhihu.com/p/608764868
  retrieved: "2026-10-12"

- method_id: M-INRUSH
  zh: 输入浪涌电流测试
  en: Input Inrush Current Test
  aliases: [浪涌电流测试, 输入冲击电流测试]
  category: input
  definition: 在输入电压峰值时刻接通输入, 测量瞬态输入电流峰值（冷启动/热机重启）, 验证限流措施与保险丝配合。
  parameters:
    - 接通相位：90°或270°（峰值点）
    - 状态：冷启动（电容放尽）与热机重启
    - 负载：最大负载
  instruments:
    - 示波器（Normal 触发，5ms/div）+ 电流探头
    - 可编程交流源（相位可控）
  interfaces:
    - 电流探头夹 AC 输入线（L 或 N）
    - 示波器 CH1 接输入电压触发
    - 输出接电子负载
    - 示波器经隔离变压器供电
  metrics:
    - 浪涌电流峰值 I_inrush（A，冷/热启动）
    - 与保险丝 I²t 配合核算
  procedure:
    - 在输入电压峰值处（90°/270° 相位）接通输入, 用电流探头/分流器记录浪涌电流峰值;
    - 分别测试冷启动与热机（电容已充电）重启;
    - 核算与输入保险丝的 I²t 配合。
  criteria:
    - 浪涌电流受 NTC/限流电阻/继电器限制在规格值内（K-PWR-116）;
    - 保险丝额定分断 I²t 须显著大于被保护器件 I²t（K-SAF-106）。
  measures: [T-INRUSH, T-HOTPLUG, T-PFC]
  rules: [K-PWR-116, K-SAF-106]
  standards: [IEC 61204]
  references:
    - https://patents.google.com/patent/CN102095921A/zh
    - http://www.jartul.com/te_service_method_copy/0/0.chtml
  retrieved: "2026-10-12"

- method_id: M-KELVIN
  zh: 四线开尔文接触电阻测试
  en: Kelvin (4-Wire) Contact Resistance Test
  aliases: [四线法测试, 接触电阻测试, 开尔文测试]
  category: general
  definition: 用四线开尔文法测量接触/导通电阻：力线与感线在被测接触点汇合, 消除引线与接触电阻引入的测量误差。
  parameters:
    - 恒流：10~100mA（不超过额定）
    - 测点：接触点汇合（力/感线）
    - 复测：每次插拔后记录
  instruments:
    - 数字微欧计/源表（四线法）
    - 四线开尔文夹具/探针
    - 恒流源（可选）
  interfaces:
    - 力线（force）与感线（sense）在被测接触点汇合
    - 四线探针/开尔文夹接被测点
  metrics:
    - 接触电阻（mΩ，探针典型 20~50mΩ）
    - 工装链路接触电阻（<0.1Ω 硬上限）
  procedure:
    - 力线（force）与感线（sense）必须在被测接触点汇合（而非探针插座处）;
    - 恒流源施加小电流（典型 10~100mA, 不超过额定）, 高阻表测压降换算电阻;
    - 每次插拔后复测并记录劣化趋势, 建立周期性复校（每班次或每 N 次插拔）。
  criteria:
    - 四线法布置正确（力/感线在被测点汇合）, 夹具引线电阻被消除（K-FIX-009）;
    - 工装链路接触电阻硬上限 0.1Ω, 探针接触电阻典型 20~50mΩ（K-FIX-005）;
    - 半 Kelvin 布置（力感线在插座处分离）未消除接触电阻, 用于接触电阻本身测量时须识别（K-FIX-010）;
    - 接触电阻上限须留时间衰减余量并建立周期复校（K-FIX-018）。
  measures: [T-KELVIN4W, T-POGOPIN, T-GRR]
  rules: [K-FIX-005, K-FIX-009, K-FIX-010, K-FIX-018]
  references:
    - https://www.bilibili.com/opus/859935787941101606
    - https://www.dediprog.com/zh-tw/product/Pogo-Pin
    - https://pogopin.com.cn/News/559.html
  retrieved: "2026-10-12"

- method_id: M-TEMP-RISE
  zh: 温升测试
  en: Temperature Rise Test
  aliases: [温升测试, 温度测试]
  category: thermal
  definition: 在额定条件下运行至热稳定, 测量关键器件（MOSFET/变压器/电解电容/整流桥等）的温升与结温余量。
  parameters:
    - 环境：25℃（或规定）
    - 负载：额定
    - 时长：至热稳定（≥30min / 45min 内变化 <1℃）
  instruments:
    - 热电偶（K/J 型）+ 数据采集仪
    - 热像仪（辅助定位）
    - 温箱
  interfaces:
    - 热电偶经胶粘固定于器件表面（MOSFET/变压器/电解电容/整流桥）
    - 数据采集仪接上位机记录
  metrics:
    - 器件温升 ΔT（K）
    - 结温 T_j（℃，≤限值）
    - 关键器件温度（℃）
  procedure:
    - 额定负载、规定环境温度（如 25℃）、额定输入下运行至热稳定（典型 ≥30min）;
    - 用热电偶/热像仪测量关键器件温度（绕组、磁性元件表面、电解电容壳体等）;
    - ΔT = 器件温度 − 环境温度; 结合热阻链路 T_j = T_a + P_loss×R_th 核算结温;
    - 记录环境温度并按降额曲线判定输出能力。
  criteria:
    - 结温 T_j 不超器件限值（ΔT = P_loss×R_th）（A-DELTA-T 链式核算）;
    - 电解电容寿命按 Arrhenius 律折算（温度每降 10℃ 寿命约翻倍）（K-THM-003）;
    - 产测须记录环境温度并与降额曲线联动判定（K-CAL-107）。
  measures: [T-JTEMP, T-RTH, T-ARRHENIUS, T-THERMALCHAMBER]
  rules: [K-THM-003, K-CAL-107]
  references:
    - https://zhuanlan.zhihu.com/p/656149742
    - https://www.szcpet.com/newsinfo/2563359.html
  retrieved: "2026-10-12"

- method_id: M-BURN-IN
  zh: 老化测试(Burn-in)
  en: Burn-in (Aging) Test
  aliases: [老化测试, 煲机测试, aging测试]
  category: reliability
  definition: 满负荷长时间运行（典型 72h）以人工加速失效, 暴露早期失效率（Infant Mortality）, 剔除潜在缺陷品。
  parameters:
    - 负载：满载（或规范加载）
    - 时长：典型 72h（可组合高温高湿/温循）
    - 监控：输出参数漂移
  instruments:
    - 老化房/老化柜（温控）
    - 多路电子负载/老化架
    - 数据记录仪（电压/纹波/ESR 监控）
  interfaces:
    - 样机批量接入老化架供电与负载回路
    - 监控通道连接输出端子
  metrics:
    - 老化后参数漂移（电压/纹波/ESR，不超限）
    - 早期失效剔除率
    - 可用度 A = MTBF/(MTBF+MTTR)
  procedure:
    - 满载（或按规范加载）长时间连续运行;
    - 多工况组合（可选）：高温高湿（如 85℃/85%RH）→ 高低温循环 → 常温全功能负载;
    - 期间监控输出参数漂移（电压/纹波/ESR 变化）;
    - 记录异常品并分析（连接器触点/电解电容/焊点等薄弱环节）。
  criteria:
    - 老化后参数不漂移超限; 出现失效或漂移超限者剔除（产线筛选）;
    - 可用度按 A = MTBF/(MTBF+MTTR) 模型核算（K-REL-001）。
  measures: [T-BURNIN, T-LONGTERM, T-MTBF]
  rules: [K-REL-001]
  references:
    - https://bbs.csdn.net/weixin_42523326/article/details/100463955
    - https://www.szcpet.com/newsinfo/2563359.html
    - https://zhuanlan.zhihu.com/p/1937994308528604765
  retrieved: "2026-10-12"

- method_id: M-PF
  zh: 功率因数与输入电流测试
  en: Power Factor and Input Current Test
  aliases: [功率因数测试, PF测试, 输入电流测试, 输入电流有效值测试]
  category: input
  definition: 在额定输入与多负载点测量交流输入的有功功率/视在功率与输入电流, 计算功率因数 PF 并核对谐波电流限值, 验证 PFC 电路与输入电流设计。
  parameters:
    - 输入电压：115Vac/60Hz 与 230Vac/50Hz（或规格规定点）
    - 负载：25%/50%/75%/100% 额定（空载测输入功率）
    - 预热：标称负载下预热 ≥30min
  instruments:
    - 功率分析仪（电压/电流通道同步采样, 可测 PF/THD/谐波）
    - 可编程交流源（低失真输出）
    - 电子负载（CC 模式）
  interfaces:
    - 输入经功率分析仪电压/电流通道接入样机 L/N/PE
    - 输出端子 V+/V− 接电子负载
  metrics:
    - 功率因数 PF（无量纲, = P/S）
    - 输入电流有效值 I_in（Arms）
    - 各次谐波电流（A, 对照 EN61000-3-2 限值）
  procedure:
    - 依规格设定输入电压、频率与输出负载;
    - 从功率分析仪读取 Pin、Iin、PF（有功/视在功率）, 计算 Pout 与效率;
    - 在各负载点记录 PF 与输入电流, 并执行谐波分析;
    - 空载时记录输入功率与输入电流。
  criteria:
    - 功率因数 PF = 有功功率 / 视在功率（K-AC-001）, 视在功率 S = V_rms × I_rms（K-AC-002）;
    - 交流输入功率 Pin = Vin × Iin × PF（K-PWR-003）, 测量须用同步采样功率分析仪（K-PWR-119）;
    - 谐波电流限值须满足 EN61000-3-2（Class D 等）对应限值。
  measures: [T-PF, T-APPARENTPOWER, T-REALPOWER, T-REACTIVEPOWER, T-RMS]
  rules: [K-AC-001, K-AC-002, K-AC-003, K-PWR-003, K-PWR-119]
  standards: [EN 61000-3-2]
  references:
    - https://blog.csdn.net/u010588566/article/details/129319535
    - https://www.intonepower.com/zh/news/understanding-total-harmonic-distortion-thd-and-power-factor-a-simplified-guide
    - https://blog.csdn.net/U_YAO/article/details/130979238
  retrieved: "2026-10-12"

- method_id: M-INPUT-SLOW
  zh: 输入缓慢变动测试
  en: Input Slow Variation Test
  aliases: [输入缓升缓降测试, 输入低压点循环测试]
  category: input
  definition: 以缓慢速率升降输入电压（如 3Vac/min）, 观察电源自我保护与恢复行为, 验证低线附近无损坏、无反复启停, 并记录关断/启动点。
  parameters:
    - 输入变化速率：3Vac/min（或按规格）
    - 负载：最大负载
    - 变化范围：从额定降至 0Vac, 再从 0Vac 升至额定
  instruments:
    - 可编程交流源（支持程序化缓变）
    - 功率表/数字万用表（记录输入/输出电压）
    - 电子负载
  interfaces:
    - 输入端子接可编程交流源
    - 输出端子 V+/V− 接电子负载（满载）
    - 电压监测点：输入/输出（万用表或记录仪）
  metrics:
    - 关断点/启动点输入电压（Vac）
    - 低压点循环稳定性（反复启停次数）
  procedure:
    - 设定最大负载与额定输入, 待稳定;
    - 以 3Vac/min 逐步调降输入电压, 记录输入/输出电压直至电源当机（关断）;
    - 从 0Vac 以同速率缓慢回升, 记录输出恢复正常时的输入电压（启动点）;
    - 产线简化版：在欠压点附近 ±3Vac 区间循环 5~8min, 观察是否反复启停。
  criteria:
    - 当机与启动输入电压须低于输入电压范围下限（K-PROT-109）;
    - 缓变过程中不得出现损坏、不稳动作或异常保护（K-LIM-001）;
    - 低压点循环运行期间电源应稳定工作, 无反复启停。
  measures: [T-WORKVOLT, T-MAXINPUT, T-UVLO]
  rules: [K-PROT-102, K-PROT-109, K-LIM-001]
  standards: [IEC 61204]
  references:
    - https://blog.csdn.net/U_YAO/article/details/130979238
    - https://www.iclabcn.com/1070.html
  retrieved: "2026-10-12"

- method_id: M-OPP
  zh: 过功率保护测试
  en: Over Power Protection Test
  aliases: [OPP测试, 过功率保护测试]
  category: protection
  definition: 通过电子负载按步进递增拉载功率, 测出过功率保护动作点与保护模式（打嗝/锁存）, 验证功率上限保护与恢复行为。
  parameters:
    - 拉载方式：恒定功率（CP）或恒定电流步进递增（步进/步长按规格）
    - 触发电压：负载输入电压跌落阈值（用于判定保护发生）
    - 输入：额定（必要时高低线）
  instruments:
    - 电子负载（支持 OPP/OCP 自动测试：起始/结束值、步数、每步时长、触发电压可编程）
    - 示波器（观察保护动作波形, 可选）
  interfaces:
    - 输出端子 V+/V− 接电子负载
    - 示波器探头接输出端（可选）
  metrics:
    - 过功率保护点（W, 标称 ±5%）
    - 保护模式：打嗝/锁存/折返
    - 保护动作后的恢复行为
  procedure:
    - 电子负载设为 OPP 测试模式, 设定功率起始值/结束值/步进/每步时间与触发电压;
    - 负载按递增步进拉载, 同时监测负载端电压判定保护是否发生;
    - 记录保护发生时的功率值, 核对是否在规格上下限内（GO/NG）;
    - 记录保护模式与解除后的恢复行为。
  criteria:
    - 保护点实测值落在标称值 ±5% 容差带内（K-PROT-111）;
    - 打嗝模式重试间隔典型数百 ms~数秒, 故障消除后自动恢复（K-PROT-104/105）;
    - 保护功能完整性：须声明 OVP/OCP/OPP/OTP/SCP（K-PROT-107）。
  measures: [T-OPP, T-HICCUP, T-FOLDBACK, T-LATCHOFF]
  rules: [K-PROT-104, K-PROT-105, K-PROT-107, K-PROT-111]
  standards: [IEC 61204]
  references:
    - http://en.apmtech.cn/cnft/thelatestnews/info.aspx?itemid=2512
    - https://www.itechate.com/uploadfiles/2020/06/202006241638433843.pdf
  retrieved: "2026-10-12"

- method_id: M-REVERSE-IN
  zh: 输入反接保护测试
  en: Input Reverse Polarity Protection Test
  aliases: [反接保护测试, 输入反接测试]
  category: protection
  definition: 在直流输入端施加反极性电压, 验证电源不损坏、反接消除后功能恢复正常, 评估防反接电路（二极管/MOS/理想二极管）有效性。
  parameters:
    - 反接电压：额定输入电压（DC）
    - 持续时间：按规格（典型数秒~1min）
    - 负载：额定
  instruments:
    - 可编程直流源（可反接输出）
    - 数字万用表（监测输入/输出）
    - 电子负载
  interfaces:
    - 直流输入端子 V+/V− 反接至直流源
    - 输出端子接电子负载
  metrics:
    - 反接期间输入电流（mA/A, 应被阻断）
    - 反接消除后输出恢复情况
  procedure:
    - 反接输入端子（正负对调）, 施加额定直流输入电压并保持规定时间;
    - 观察输入电流是否被有效阻断（数 mA 级为佳）, 样机有无发热/冒烟;
    - 断开反接, 恢复正常极性上电, 检查输出功能与参数是否正常;
    - 记录反接前后关键参数对比。
  criteria:
    - 输入反接不损坏, 反接消除后功能恢复正常（K-PROT-116）;
    - 防反接电路（二极管/MOS/理想二极管）不得影响正常导通损耗与效率（评估性判据）。
  measures: [T-REVERSEIN]
  rules: [K-PROT-116]
  standards: []
  references:
    - https://blog.csdn.net/qq_21794157/article/details/131388533
    - https://www.yfwdiode.com/news/169.html
    - https://www.silicontent.com/blog-info?id=33
  retrieved: "2026-10-12"

- method_id: M-ORING
  zh: 输出防倒灌(反灌)测试
  en: Output Reverse Current Blocking Test
  aliases: [防倒灌测试, 反灌电流测试, ORing测试]
  category: protection
  definition: 在输出端施加高于输出的外部电压, 验证防倒灌电路（ORing 二极管/理想二极管）阻断反向电流, 并评估压降与关断速度。
  parameters:
    - 外部电压：输出标称以上（如 +5%~10% 或按规格）
    - 观察对象：反向电流大小与阻断时间
  instruments:
    - 可编程直流源（模拟外部母线电压）
    - 示波器 + 电流探头/精密分流器（测反向电流）
    - 电子负载
  interfaces:
    - 外部电源正接输出端子 + 极（高于 Vout）
    - 电流探头/分流器串入输出回路
    - 样机输出端子接电子负载（或不接载）
  metrics:
    - 反向电流峰值/稳态（µA~mA, 理想二极管典型反向阻断）
    - 反向关断时间（µs 级, 如 0.75µs 快速关断）
  procedure:
    - 样机正常输出, 记录输出电压;
    - 将外部电源电压调至高于输出值, 接至输出端子;
    - 用电流探头/分流器观察从样机流向外部电源的反向电流;
    - 逐步升高外部电压, 记录反向电流与阻断行为;
    - 撤销外部电压, 确认样机输出正常。
  criteria:
    - 带电池母线/并联应用须防止外部能量经输出端反灌入模块（K-PROT-117）;
    - 防倒灌器件压降与关断速度须满足系统要求（评估性判据）。
  measures: [T-ORING, T-REVERSEIN]
  rules: [K-PROT-117]
  standards: []
  references:
    - https://patents.google.com/patent/CN204131383U/zh
    - https://www.eet-china.com/mp/a345841.html
    - https://www.silicontent.com/blog-info?id=33
  retrieved: "2026-10-12"

- method_id: M-SHARE
  zh: 并联均流测试
  en: Parallel Current Sharing Test
  aliases: [均流测试, 均流度测试, 并联测试]
  category: output
  definition: 将多台/多模块并联带载, 测量各模块电流分配偏差（均流度）, 验证均流设计（下垂法等）满足偏差限值。
  parameters:
    - 并联数量：≥2（含 N+1 冗余场景）
    - 负载：10%~100% 额定（多点）
    - 导线：各模块输出线长/截面积一致
  instruments:
    - 电子负载（容量覆盖并联总输出）
    - 电流表/电流探头（逐模块测流, 或读取各模块遥测）
    - 上位机（记录均流数据）
  interfaces:
    - 各模块输出并联至同一电子负载
    - 均流母线（如支持）互连
    - 遥测/通信口读取各模块电流
  metrics:
    - 均流度/电流分配偏差（≤±5% 额定输出电流）
    - 各模块输出电流偏差（A）
  procedure:
    - 按规范并联接好模块（输出线等长）, 接入电子负载;
    - 在 10%~100% 负载多点测量各模块输出电流;
    - 计算均流偏差：[I_i − I_avg] / I_额定 等口径;
    - （N+1）拔除/关断单模块, 验证母线电压保持与剩余模块自动分担。
  criteria:
    - 并联模块分担电流偏差 ≤ ±5%（典型）（K-PWR-113, K-SHR-001/002）;
    - 均流偏差超限（>±10%）须检测并告警（K-CTL-104）;
    - 单模块故障须自动退出并保持母线（N+1）（K-PROT-118）。
  measures: [T-SHARE, T-DROOP, T-NPLUS1]
  rules: [K-PWR-113, K-SHR-001, K-SHR-002, K-CTL-104, K-PROT-118]
  standards: []
  references:
    - https://www.21ic.com/a/974757.html
    - https://baike.baidu.com/item/%E5%9D%87%E6%B5%81%E5%BA%A6/18253620
    - https://www.chinaaet.com/article/173620
    - https://patents.google.com/patent/CN103683479A/zh
  retrieved: "2026-10-12"

- method_id: M-TELEMETRY
  zh: 遥测精度测试
  en: Telemetry Accuracy Test
  aliases: [遥测测试, 回读精度测试, 遥测精度测试]
  category: communication
  definition: 通过 PMBus/I2C 等通信接口读回输入/输出电压、电流、功率与温度遥测值, 与基准仪表比对, 验证遥测精度、采样带宽与标定持久化。
  parameters:
    - 工况：至少覆盖 10%/50%/100% 负载与常温
    - 比对基准：六位半万用表/功率分析仪, 高精度温度计
    - 标定：按需执行增益/偏置标定并断电重启验证持久化
  instruments:
    - 上位机 + PMBus/I2C 通信适配器（或专用测试盒）
    - 数字万用表/功率分析仪（精度高于遥测规格 3~10 倍）
    - 电子负载与可编程源
  interfaces:
    - 通信口（PMBus/I2C：SDA/SCL、地址线）接适配器
    - 输出端子 V+/V− 接电子负载与基准仪表
    - 测温度点：NTC/传感器
  metrics:
    - 电压/电流遥测误差（≤±(0.5~1)% 读数 + ±0.5% 量程）
    - 温度遥测误差（℃, ≤传感器公差合成）
    - 采样率/带宽是否覆盖开关纹波频率（≥2 倍 Nyquist）
  procedure:
    - 上位机经通信口读取各遥测寄存器（Vout/Iout/Pin/Temp 等）;
    - 在同工况下用基准仪表读取实际值, 逐一比对计算误差;
    - 检查采样率是否覆盖被测最高频率分量（开关频率及其谐波）;
    - 执行标定（如需）, 断电重启后复查标定系数持久化与回读一致性。
  criteria:
    - 电压/电流遥测误差 ≤ ±(0.5~1)% 读数 + ±0.5% 量程（K-TLM-101）;
    - 采样率须覆盖被测信号最高频率分量（K-TLM-102）;
    - 温度遥测误差 ≤ 传感器与电阻公差合成误差（K-TLM-105）;
    - 设定值回读一致性：回读值与设定值偏差 ≤ 设定精度带（K-TLM-108）;
    - 标定系数写入非易失存储, 掉电重启后保持（K-CAL-101/102）。
  measures: [T-TELEMETRY, T-CALIB, T-PMBUS]
  rules: [K-TLM-101, K-TLM-102, K-TLM-105, K-TLM-108, K-CAL-101, K-CAL-102]
  standards: [PMBus 1.3]
  references:
    - https://www.21ic.com/a/924474.html
    - https://zhuanlan.zhihu.com/p/2083493365044327730
    - https://bbs.csdn.net/weixin_29190169/article/details/100224907
  retrieved: "2026-10-12"

- method_id: M-TELESIGNAL
  zh: 遥信与告警上报测试
  en: Telesignal and Alarm Reporting Test
  aliases: [遥信测试, 告警上报测试, 干接点测试]
  category: communication
  definition: 通过故障模拟注入保护触发条件, 验证遥信状态位与告警输出（干接点/光耦/通信位）的上报正确性、去抖与上报时延, 以及故障锁存与复位行为。
  parameters:
    - 故障场景：欠压/过压/过流/过温/短路等模拟项（按告警清单）
    - 监测：状态信号与控制信号同步录波
    - 去抖设置：0/10/30/100ms 等档位（如支持）
  instruments:
    - 故障注入工装/模拟盒（含开路、短路、对轨短路三类）
    - 上位机（读取通信告警位） + 示波器/记录仪（干接点动作）
    - 万用表（干接点通断）
  interfaces:
    - 告警输出接口：干接点/光耦（与被测电平匹配, 常用隔离）
    - 通信口：告警位/状态字读取
    - 故障注入通道接被测点
  metrics:
    - 告警上报时延（≤规格值, 典型 ≤1s）
    - 遥信极性/干接点一致性（常开/常闭与语义）
    - 去抖时间（ms 档位）
    - 故障锁存与故障码可查性
  procedure:
    - 按告警清单逐项注入故障条件（含并发场景）;
    - 同步监测告警干接点动作与通信状态位;
    - 记录从条件成立到告警上报的时延, 验证去抖滤波;
    - 触发最高级故障, 验证锁存与故障码读取, 复位后清除;
    - 验证多告警并发时的严重度仲裁（停机>降额>预警）。
  criteria:
    - 数字量输入须设去抖滤波（K-TLM-103）;
    - 告警上报时延 ≤ 规格值（K-TLM-110）;
    - 遥信极性/干接点语义与失效安全一致（K-TLM-111）;
    - 欠压期间须置遥信告警（K-PROT-110）;
    - 最高级故障锁存并记录故障码（K-PROT-114）; 多告警按严重度仲裁（K-PROT-115）;
    - 告警分级（预警/降额/停机）与输出接口隔离（K-CTL-101, K-CTL-102）。
  measures: [T-TELESIGNAL, T-ALARM, T-DRYCONTACT, T-FAULTLATCH, T-HYSTERESIS]
  rules: [K-TLM-103, K-TLM-110, K-TLM-111, K-PROT-110, K-PROT-114, K-PROT-115, K-CTL-101, K-CTL-102]
  standards: []
  references:
    - https://patents.google.com/patent/CN116106777A/zh
    - https://www.h3c.com/cn/d_202603/2776209_30005_0.htm
    - https://www.ibm.com/docs/zh/datapower-gateway/11.0.0?topic=appliance-troubleshooting-power-supply-modules
