- method_id: M-UVP
  zh: 输出欠压保护测试
  en: Output Under Voltage Protection Test
  aliases: [UVP测试, 输出欠压保护测试]
  category: protection
  definition: 调整/拉低输出电压直至触发欠压报警或保护, 记录动作点与恢复点, 验证输出欠压保护及回差。
  parameters:
    - 拉低方式：通过设定或过载使输出电压缓慢下降
    - 观察项：欠压报警点、恢复点与回差
  instruments:
    - 可编程直流源/电子负载（制造输出欠压条件）
    - 数字万用表/示波器（记录阈值）
  interfaces:
    - 输出端子 V+/V− 接电子负载
    - 示波器/万用表监测输出
  metrics:
    - 输出欠压保护点（V）
    - 恢复点与回差（V）
  procedure:
    - 缓慢降低输出（或加深拉载）直至欠压报警/保护动作, 记录阈值;
    - 缓慢回升输出直至报警消失, 记录恢复点, 计算回差;
