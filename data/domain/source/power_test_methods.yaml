# ────────────────────────────────────────────────────────────────────
# TC-15 STARTUP-TIME (subset of M-STARTUP): distinct timing parameter
# ────────────────────────────────────────────────────────────────────
- method_id: M-STARTUP-TIME
  zh: 启动时间精确测试 (ton/tr 阶跃测量)
  en: Start-up Precise Timing Test
  aliases: [启动时间测试, ton测量, tr测量]
  category: dynamics
  definition: 用 8 通道示波器同步采样输入/输出/PG/输入电流 4 路信号, 精确测量开机延迟 (ton, 接通→输出开始上升) 与上升时间 (tr, 10%→90% 额定), 并与 PG/PGOOD 建立时序对齐 (8-ch 多路示波器 Tek 用法, Tektronix 应用笔记经典案例)。
  parameters:
    - 负载模式 CC / CR / CP (CR 对电源最温和, CP 最严酷)
    - 输入相位 0/90/180/270 度任选, 含最不利的 AC 峰值接通
    - 记录输入电压波形 / 输出上升波形 / PG / 输入电流 inrush
  instruments:
    - 8 通道示波器 (Tek MSO46/MSO64 推荐, 满足业内 8-ch sequencing 应用笔记推荐)
    - 电流探头 (AC/DC, Tek TCP 系列)
    - 差分探头 (高压隔离)
    - 电子负载 (CC/CR/CP 各模式)
    - 可编程交流源
  interfaces:
    - CH1 输入电压 / 差分探头隔离
    - CH2 输出电压上升波形
    - CH3 PG 或 PGOOD 信号 (如具备)
    - CH4 输入电流 / 电流探头
  metrics:
    - 开机延迟 ton (ms, 接通电源到输出开始上升)
    - 输出上升时间 tr (ms, 10% 到 90% Vnom)
    - PG 相对输出建立延时 (ms)
    - 启动过冲幅度 (%, 详见 M-OVERSHOOT)
  procedure:
    - 设定额定负载模式 (CC/CR/CP 任选, 记录在报告)
    - 以规定相角接通输入, 用示波器 (Infinite Persistence / History) 同步四路
    - 读取 ton 与 tr (自动测量或统计光标), 计算 PG 与输出建立的时序关系
    - 重复 N 次 (typical 10) 观察时序一致性与启动过冲
    - 与规格比对, 异常项记入报告 (包括 PG 缺失等)
  criteria:
    - 启动时间 ton/tr 不超规格, 典型限值 ≤100ms, 依产品规范 (K-PWR-109)
    - PG 或 PGOOD 应在输出稳压后建立, 典型 <100ms 延时, 不得先于输出翻转
    - 多个接通相角的时序一致性应在 ±5% 内, 电源设计余量
  measures: [T-STARTUPTIME, T-RISETIME, T-PGOOD, T-STARTOVERSHOOT]
  rules: [K-PWR-109]
  standards: [IEC 62368-1]
  references:
    - "https://www.tek.com/en/documents/application-note/verifying-power-supply-sequencing-8-channel-oscilloscope"
    - "https://www.eenewseurope.com/en/speeding-up-power-rail-timing-verification-with-an-8-channel-oscilloscope/"
    - "https://www.rohde-schwarz.com/us/applications/accurate-verification-of-power-supply-startup-sequences-for-auxiliary-bias-supplies_56279-1301059.html"
  retrieved: "2026-10-19"

# ────────────────────────────────────────────────────────────────────
# TC-16 OUTPUT OVERSHOOT (subset of M-STARTUP): turn-on overshoot only
# ────────────────────────────────────────────────────────────────────
- method_id: M-OVERSHOOT
  zh: 输出启动过冲测试
  en: Output Turn-On Overshoot Test
  aliases: [启动过冲测试, overshoot测量]
  category: output
  definition: 接通输入时观察输出电压超调峰值 (与稳态额定 Vnom 比较). 验证软启动/闭环抑制使过冲落在规格带内。
  parameters:
    - 负载工况 0 / 满载 / 50% 满载三种
    - 输入相位 90 或 270 度, AC 峰值接通最严酷
    - 观察窗口 上电后 0 到 200ms
  instruments:
    - 示波器 (Tek MSO46 1GHz 带宽, 20MHz 带宽限制以避免开关尖峰误判)
    - 差分探头
    - 可编程交流源
    - 电子负载
  interfaces:
    - 示波器 CH1 经差分探头接输出 V+/V- (靠接治具, 短地环路)
    - 输入同步触发 (CH1 电压触发起动点)
  metrics:
    - 过冲幅度 peak vs Vnom (%)
    - 过冲持续时间 (ms, 超过恢复带时段)
    - 多个接通相角下过冲一致性 (%)
  procedure:
    - 用示波器 Hi-Res / Average 模式采输出波形 (max-Min 即可看出过冲)
    - 计算过冲 (Vpeak − Vnom) / Vnom × 100%
    - 在三种负载 + 两个最严相位条件下重复测试
    - 验证软启动使过冲带通常 ≤5% (通信电源严苛 ≤1%)
  criteria:
    - 启动过冲 ≤5% Vnom (K-PWR-109 通用限值)
    - 通信电源 ≤1% Vnom, 5G/服务器等高端电源要求更严
    - 软启动受控, 不出现异常门控斜率
  measures: [T-STARTOVERSHOOT, T-SOFTSTART]
  rules: [K-PWR-109]
  standards: [IEC 61204, IEC 62368-1]
  references:
    - "https://www.celectronics.com/learning-center/en-iec-61204-3"
    - "https://standards.iteh.ai/catalog/standards/iec/d1b5eed4-23be-42a6-adca-5e9283379efb/iec-61204-1993-amd1-2001"
    - "https://www.psma.org/wp-content/uploads/2021/01/Thermal-measurments-Final.pdf"
  retrieved: "2026-10-19"

# ────────────────────────────────────────────────────────────────────
# TC-12 CROSS-REGULATION
# ────────────────────────────────────────────────────────────────────
- method_id: M-CROSS-REG
  zh: 交叉调整率测试 (多轨)
  en: Multi-Rail Cross-Regulation Test
  aliases: [交叉调整率测试, multi-rail regulation]
  category: output
  definition: 对多轨输出电源, 让某轨负载变化 (0%→100%), 测其他轨输出电压偏离. 验证变压器/磁反馈稳压设计的跨轨耦合.
  parameters:
    - 多轨要求 至少 2 轨 (RAIL_A + RAIL_B)
    - 不变轨 RAIL_under_test 维持标称负载
    - 扰动轨 RAIL_agitate 按 0% / 50% / 100% 三点逐档突变
    - 测量量 RAIL_under_test 的 ΔV (mV 或 %)
  instruments:
    - 数字万用表 6½ 位 (Keithley 2110 或 HP/Keysight 34461A)
    - 多通道电子负载 (dual-output Chroma 63206 或 ITECH IT-M3900)
    - 4 线 Kelvin 接线
  interfaces:
    - DUT 多轨输出 L+ / L- (每轨 4-wire Kelvin sense)
    - DMM HI/LO 跨轨切换扫描
  metrics:
    - 跨轨调整率 (mV 或 %)
    - 故障跨轨输出之一低载, 其他仍稳定 (K-CROSS-001)
  procedure:
    - 标称输入下双轨带载至额定, 读取 Vout_A 与 Vout_B 稳定
    - 把 B 轨从空载 突变到 50% 再突变到 100%, 每档稳态后读 A 即 DUT 轨
    - 计算 A 轨 ΔV 偏离 = (V_A_min - V_A_max) / V_nom × 100%
    - 再以同样方法测 B 相对 A 的扰动, 对称执行
    - 记录工况与温度对调整率的影响
  criteria:
    - 跨轨调整率 ≤5% (典型 ±1-2%), 判据余量须大于仪器精度 2 倍 (K-PWR-111)
    - 多轨设计中单通道失效须自动隔离, 母线不中断 (K-PROT-118)
  measures: [T-CROSSREG]
  rules: [K-PWR-110, K-PWR-111, K-PROT-118]
  standards: [IEC 61204]
  references:
    - "https://www2.xppower.com/portals/0/brochures/Essential_Guide_to_Power_Supplies.pdf"
    - "https://www.us.lambda.tdk.com/resources/blogs/20120409.html"
    - "https://www.celectronics.com/Specialty-Product-Testing/Power-Supply-IEC61204"
    - "https://www.testworld.com/wp-content/uploads/power-supply-testing.pdf"
  retrieved: "2026-10-19"

