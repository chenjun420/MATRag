- method_id: M-TELECONTROL
  zh: 遥控开关机与设定测试
  en: Remote Control (On/Off and Setpoint) Test
  aliases: [遥控测试, 远程开关机测试, 远端设定测试]
  category: communication
  definition: 通过遥控接口（通信命令或使能引脚）执行开/关机与设定值下发, 验证遥控优先级（本地-远端切换）、响应时延与设定值限幅/回读一致性。
  parameters:
    - 命令序列：开机→设定值扫描→关机; 本地/远端切换场景
    - 设定范围：全量程（含上下限与越界值）
  instruments:
    - 上位机（遥控命令下发与回读）
    - 示波器（输出建立/关断与命令的时序）
    - 电子负载
  interfaces:
    - 遥控使能引脚（EN/RE）或通信口接上位机
    - 输出端子接电子负载, 示波器监测输出
  metrics:
    - 遥控开机/关机响应时延（≤规格值）
    - 设定值回读偏差（≤设定精度带）
    - 设定值限幅（上限 ≤ OCP 等硬件保护范围）
  procedure:
    - 远端模式下下发开机命令, 记录输出建立时延; 下发关机, 记录关断时延;
    - 下发设定值（含上下限）, 回读并与实际输出比对;
    - 尝试下发越界设定值, 验证限幅在硬件保护范围内;
    - 切换本地/远端模式, 验证操作互斥与优先级提示;
    - 数字控制器：验证看门狗超时后的安全复位行为。
  criteria:
    - 远端遥控使能时本地面板失效或明确提示（K-TLM-106）;
    - 遥控可设定范围完全包含于硬件保护范围内（K-TLM-107）;
    - 设定值回读一致性 ≤ 设定精度带（K-TLM-108）;
    - 开/关机与设定下发的响应时延 ≤ 规格值（K-TLM-109）;
    - 数字控制器须具备看门狗, 超时后安全复位（K-PROT-113）。
  measures: [T-TELECONTROL, T-TELEADJUST, T-ENABLE, T-WDT]
  rules: [K-TLM-106, K-TLM-107, K-TLM-108, K-TLM-109, K-PROT-113]
  standards: []
  references:
    - https://patents.google.com/patent/CN101727368A/zh
    - https://www.tek.com/en/documents/application-note/verifying-power-supply-sequencing-8-channel-oscilloscope
    - https://www.upsmate.com/news/shownews.php?id=94
  retrieved: "2026-10-12"

- method_id: M-COMM
  zh: 通信接口测试
  en: Communication Interface Test
  aliases: [通信测试, RS485测试, 回环测试]
  category: communication
  definition: 对数字通信接口执行回环/自检与压力测试：验证物理层连通、地址唯一性、帧格式/CRC、误码率与断线恢复, 保证遥测/遥信/遥控可靠。
  parameters:
    - 接口类型：RS485/RS232/CAN/PMBus 等（按型号）
    - 波特率：最高使用速率
    - 场景：正常通信、地址冲突、断线重连、错误帧注入
  instruments:
    - 上位机 + 通信适配器（支持该协议）
    - 示波器/协议分析仪（物理层波形与帧解码, 可选）
    - 终端电阻/总线线束
  interfaces:
    - 通信端子（A/B、SDA/SCL 等）接适配器与总线
    - 多点拓扑：测试地址唯一性与总线冲突
  metrics:
    - 回环/自检通过率（100%）
    - 误码率 BER（工业典型 ≤10⁻⁶, 严苛 ≤10⁻⁷）
    - 地址唯一性（同一总线无冲突）
    - 断线恢复时间
  procedure:
    - 单机回环：适配器自发自收验证物理层与协议基本功能;
    - 多点组网：多台同总线, 逐台寻址验证地址唯一性与响应;
    - 以最高波特率连续通信（压力测试）, 统计误码率;
    - 注入错误帧/断线, 验证容错与自动恢复;
    - 检查终端电阻匹配与波形质量（必要时）。
  criteria:
    - 通信接口产测须做回环/自检测试; RS485 须验证地址唯一性与误码（K-TLM-112）;
    - 通信中断/看门狗超时后须安全复位（K-PROT-113）。
  measures: [T-PMBUS, T-WDT]
  rules: [K-TLM-112, K-PROT-113]
  standards: []
  references:
    - https://blog.csdn.net/weixin_33610780/article/details/157085840
    - https://patents.google.com/patent/CN205229445U/zh
    - https://gnsems.com/zh-CN/how-to-solve-problems-related-to-why-rs485-communication-fails
  retrieved: "2026-10-12"

- method_id: M-POWERCYCLE
  zh: 开关机循环测试
  en: Power On/Off Cycling Test
  aliases: [开关循环测试, 通断循环测试]
  category: reliability
  definition: 以规定节奏反复通断输入电源, 验证电源在反复启动应力（浪涌/热应力）下的工作稳定性与参数一致性。
  parameters:
    - 节奏：合 15s / 断 5s（或按规范）, 连续 2h（产线可加严）
    - 负载：最大负载
    - 环境：常温（或高温）
  instruments:
    - 接触器/继电器控制回路（或可编程交流源）
    - 电子负载
    - 数据记录仪（输出电压监测）
  interfaces:
    - 输入经接触器/继电器接交流源
    - 输出端子接电子负载
    - 监测通道接输出端与输入
  metrics:
    - 循环次数（次）
    - 输出电压一致性/漂移（V）
    - 异常次数（0）
  procedure:
    - 输入端接循环控制（接触器）与交流源, 输出满载;
    - 设定合 15s/断 5s 循环, 连续运行 2h（或规范时长）;
    - 全程监测输出电压与样机状态, 记录异常;
    - 结束后复测关键参数并与初始值比对。
  criteria:
    - 循环期间电源正常工作, 试验后性能无明显变化;
    - 每次启动浪涌电流仍受 NTC/限流措施限制（K-PWR-116）。
  measures: [T-INRUSH, T-LONGTERM, T-BURNIN]
  rules: [K-PWR-116]
  standards: []
  references:
    - https://www.sohu.com/a/733237521_100175321
    - https://www.iclabcn.com/1070.html
    - https://zhuanlan.zhihu.com/p/620038384
