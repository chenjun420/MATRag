# 电源产品产测方法（通用知识 / 公共知识, 2026-10-12 websearch 补齐）
#
# 定位: 芯片测试与产线测试条目的"方法"层。方法通过 measures(术语) 与 rules(域规则)
#   把产品/参数/保护/安规等实体联系起来（很多实体都是通过硬件测试方法发生关联）。
# 字段:
#   method_id  唯一 id (M-XXX); zh/en 名称; aliases 别名（检索链接用）;
#   category   ∈ matrag.domain.vocab.CATEGORIES;
#   definition 一句话定义; parameters 测试条件与参数; instruments 所需仪表（含关键规格）;
#   interfaces 接口与接线; metrics 测试指标;
#   procedure 测试步骤; criteria 判据（引用规则 id）;
#   measures   关联术语 id (T-*); rules 关联域规则 id (K-*);
#   standards  引用标准（可省略）; references 检索来源 URL; retrieved 检索日期。
# 本项目内该文件为"通用知识"（不绑定型号）, 具体限值以产品规格书为准。

- method_id: M-RIPPLE-NOISE
  zh: 输出纹波与噪声测试
  en: Output Ripple and Noise Test
  aliases: [纹波测试, 输出纹波测量, 纹波与噪声测量]
  category: output
  definition: 测量直流输出上叠加的交流纹波与噪声峰峰值, 验证电源输出质量是否满足规格限值; 行业通用做法为示波器 20MHz 带宽限制 + 靠接法测量。
  parameters:
    - 输入电压：额定及上下限（如 115/230Vac 或 90~264Vac 范围点）
    - 负载：满载/半载等组合工况
    - 温度：常温（必要时高/低温）
    - 示波器设置：20MHz 带宽限制、AC 耦合、1~10mV/div
  instruments:
    - 示波器（带宽 ≥100MHz，支持 20MHz 带宽限制）
    - 无源探头（1X 或 10:1）配接地弹簧/靠接治具
    - 去耦电容组（10µF 电解 + 0.1µF 陶瓷，或 50Ω 同轴+隔直板）
    - 电子负载（CC 模式）
  interfaces:
    - 输出端子 V+/V− 探头靠接输出电容两端（接地回路 <1cm）
    - 输入端子 L/N/PE 接可编程交流源
    - 示波器供电经隔离（避免共地噪声）
  metrics:
    - 纹波与噪声峰峰值 Vpp（mVpp，20MHz 带宽限制下）
    - 电感纹波电流峰峰值 ΔI_L（App）
    - 电容纹波电流有效值 I_rms（Arms）
  procedure:
    - 示波器设 AC 耦合、带宽限制 20MHz; 探头用 1X 档（或 10:1 配合带宽限制）, 以接地弹簧/靠接法替代长地线, 避免地线环路谐振放大高频噪声;
    - 探头上并联去耦电容组（典型 10µF 电解 + 0.1µF 陶瓷）或经隔直板接同轴电缆, 滤除非真实的拾取噪声;
    - 测量点选输出电容两端（SMD 焊盘等无感测试点）, 远离开关节点/变压器/整流回路等辐射源;
    - 垂直灵敏度 1~10mV/div, 时基取 1~2 个开关周期, 边沿触发捕获稳定周期波形;
    - 在满载/半载、输入高低限、温度极值等组合工况下记录纹波峰峰值, 与规格限值比对。
  criteria:
    - 输出纹波峰峰值 ≤ 规格限值（模块电源典型 ≤1%·Vout 或 50~100mVpp）, 实测须使用 20MHz 带宽限制与去耦电容（K-PWR-102）;
    - 电容实际纹波电流有效值 ≤ 额定纹波电流, 超额定将按 Arrhenius 律加速老化（K-PWR-103）;
    - 电感纹波电流峰峰值实测 ≤ 设计值 ΔI_L, 峰值电流不得超出饱和值（K-PWR-104）。
  measures: [T-RIPPLE, T-RIPPLEVOLT, T-RIPPLE-CURRENT, T-ESR, T-VPP, T-SWITCHFREQ]
  rules: [K-PWR-101, K-PWR-102, K-PWR-103, K-PWR-104]
  standards: [IEC 61204]
  references:
    - https://e2echina.ti.com/cfs-file/__key/communityserver-discussions-components-files/24/0624.TI_2D008259554F636B6E784B6DD58B3575906E8476B97EE26C1FFF_.pdf
    - https://www.digikey.cn/zh/forum/t/topic/5575
    - https://www.legend-si.com/newsinfo/8071541.html
    - https://news.eeworld.com.cn/Test_and_measurement/2015/0630/article_12152.html
  retrieved: "2026-10-12"

- method_id: M-HOLDUP
  zh: 掉电保持时间测试
  en: Hold-up Time Test
  aliases: [保持时间测试, 掉电保持测试, hold-up测试]
  category: dynamics
  definition: 切断交流输入后, 测量直流输出维持在规定范围内（标称 90% 以上）的时间, 验证母线储能对市电跌落（如一个工频周期）的支撑能力。
  parameters:
    - 输入：最低工作电压（母线最低点）
    - 负载：规定负载（如 0.5×额定）
    - 条件：输出跌落至标称 90% 计时
  instruments:
    - 电子负载（带时间量测/外部触发 TRI 功能）
    - 示波器（电压电平触发）
    - 可编程交流源（支持同步断开的开关控制）
  interfaces:
    - 交流输入经开关/继电器与触发信号同步
    - 输出端子 V+/V− 接电子负载
    - 触发线连接负载 TRI 口与 AC 开关
  metrics:
    - 保持时间 t_hold（ms，≥16~20ms 或规格值）
    - 输出下跌拐点电压（90% 标称）
    - 关机下冲与下降时间（记录曲线）
  procedure:
    - 在最低输入电压（母线电压最低点）与规定负载（如 CC=0.5A）下运行至稳定;
    - 用开关/继电器同步切断 AC 输入, 以电子负载或示波器的电平触发（TRI 外部触发→输出电压下降沿）捕获时间差;
    - 记录输出从标称跌落至允许下限（标称 90%）的时间; 多次重复取最小值;
    - 与规格值比对（通用要求 ≥16~20ms, 对应 50Hz 一个市电周期）, 并用最低母线电压核算储能电容。
  criteria:
    - 断电后输出维持标称 90% 以上的时间 ≥ 规格值（通用 ≥16~20ms）（K-PWR-114）;
    - 母线储能电容 C ≥ 2·P_out·t_hold / (η·(V1²−V2²)), 须按最低输入电压核算（K-PWR-115）。
  measures: [T-HOLDUP, T-RECTBUS, T-WORKVOLT]
  rules: [K-PWR-114, K-PWR-115]
  standards: [IEC 61204]
  references:
    - https://bbs.21dianyuan.com/thread-238263-1-1.html
    - https://baike.baidu.com/item/%E7%94%B5%E6%BA%90%E4%BF%9D%E6%8C%81%E6%97%B6%E9%97%B4/5147058
    - https://zhuanlan.zhihu.com/p/608764868
    - http://www.jartul.com/te_service_method_copy/0/0.chtml
  retrieved: "2026-10-12"

- method_id: M-UVLO
  zh: 欠压保护(UVLO)测试
  en: Input Undervoltage Lockout Test
  aliases: [欠压锁定测试, 欠压保护测试, UVLO测试]
  category: protection
  definition: 缓慢升降输入电压, 测量输出的关断点（UVLO 停止阈值）、恢复点（启动阈值）及回差, 并验证欠压期间的告警行为。
  parameters:
    - 输入：缓慢升/降（如 3Vac/min 或按规格速率）
    - 负载：额定
    - 温度：常温及高/低温复测
  instruments:
    - 可编程交/直流源（可程序化缓变）
    - 数字万用表/上位机读数（记录输入/输出电压）
    - 电子负载
  interfaces:
    - 输入端子接可编程源
    - 输出端子接电子负载
    - 遥信/通信口（观察欠压告警上报）
  metrics:
    - UVLO 关断点、启动点（V）
    - 回差 = 启动点 − 关断点（V）
    - 欠压告警点（V）
  procedure:
    - 额定负载下缓慢降低输入电压至输出关断, 记录 UVLO 关断点;
    - 缓慢回升输入电压至输出恢复, 记录启动阈值; 回差 = 恢复点 − 关断点;
    - 在高/常温等温度工况与多台样机上复测, 记录最小/最大/典型三档限值;
    - 观察欠压告警区（低于告警点、高于关断点）内遥信是否上报、输出是否继续运行。
  criteria:
    - 最低工作电压 < UVLO 启动阈值 < UVLO 关断阈值, 欠压告警点高于最低工作电压（K-PROT-109）;
    - 欠压告警区内须上报遥信并可继续运行, 跌至关断点才保护（K-PROT-110）;
    - 回差 ≥ max(设定值×1%, 输入噪声峰峰值×2)（K-PROT-108）;
    - UVLO 三档限值须覆盖整个工作温度范围, 典型值不可用于判定（K-PROT-103）。
  measures: [T-UVLO, T-UVP, T-HYSTERESIS, T-WORKVOLT]
  rules: [K-PROT-102, K-PROT-103, K-PROT-108, K-PROT-109, K-PROT-110]
  standards: [IEC 61204]
  references:
    - https://zhuanlan.zhihu.com/p/699450936
    - https://www.szwanbo.com/industry-news/539386.html
    - https://blog.csdn.net/Namisooft/article/details/154358263
  retrieved: "2026-10-12"

- method_id: M-OCP
  zh: 过流保护测试
  en: Over Current Protection Test
  aliases: [过流保护测试, OCP测试, 限流点测试]
  category: protection
  definition: 逐步增加负载电流, 测量输出进入保护（限流/关断）的电流点与保护模式（打嗝/锁存）, 并验证恢复行为与保护点精度。
  parameters:
    - 输入：额定（及高低线）
    - 负载：CC 模式逐步递增
    - 温度：常温（必要时高温）
  instruments:
    - 电子负载（CC 模式，带 OCP 自动测试功能）
    - 示波器（观察输出波形/电流探头可选）
  interfaces:
    - 输出端子 V+/V− 接电子负载
    - 示波器探头接输出端
  metrics:
    - OCP 保护点（A，容差 ±5%）
    - 保护模式判定（打嗝/锁存/折返）
    - 重试间隔（打嗝模式，ms~s）
  procedure:
    - 电子负载以 CC 模式逐步增加电流, 记录输出进入保护时的电流值;
    - 判定保护模式：打嗝（hiccup, 周期重试）/锁存（锁定关断需人工或重新上电复位）/折返;
    - 对打嗝模式记录重试间隔; 对锁存模式记录复位条件与故障码;
    - 保护点与标称值比对（±5% 容差内）, 重复多台样机。
  criteria:
    - 保护点实测值落在标称 ±5% 容差带内（K-PROT-111）;
    - 打嗝模式重试间隔典型数百 ms~数秒, 故障消除后自动恢复（K-PROT-104/105）;
    - 最高级故障须锁存并记录可查询故障码, 复位条件明确（K-PROT-114）。
  measures: [T-OCP, T-HICCUP, T-LATCHOFF]
  rules: [K-PROT-104, K-PROT-105, K-PROT-111, K-PROT-114]
  standards: [IEC 61204]
  references:
    - https://www.fcpowerup.com/how-do-i-test-power-supplies
    - https://zhuanlan.zhihu.com/p/699450936
    - https://www.szwanbo.com/industry-news/539386.html
  retrieved: "2026-10-12"

- method_id: M-OTP
  zh: 过温保护测试
  en: Over Temperature Protection Test
  aliases: [过温保护测试, OTP测试]
  category: protection
  definition: 将样机置于温箱/加热环境升温, 测量过温保护触发点、恢复点与回差, 并验证保护/恢复行为。
  parameters:
    - 环境：温箱从常温逐步升温
    - 负载：额定
    - 温度：覆盖保护点及恢复点
  instruments:
    - 温箱（控温范围覆盖保护点）
    - 热电偶/温度记录仪（或读取 NTC 遥测温度）
    - 电子负载
  interfaces:
    - 样机置于温箱内带载运行
    - NTC/遥测温度读取接口（如 I2C/PMBus）
    - 输出端子接电子负载
  metrics:
    - 过温保护触发点（℃）
    - 恢复点与回差（℃）
    - 温度遥测读数误差（℃）
  procedure:
    - 额定负载下将样机放入温箱, 从常温逐步升温, 记录过温保护触发点（典型读取 NTC/遥测温度）;
    - 逐步降温, 记录保护恢复点与回差;
    - 记录保护模式（关断/降额）与恢复方式（自动/复位）;
    - 结合热阻链路核算结温余量。
  criteria:
    - 过温保护点与回差符合规格; 回差 ≥ max(设定值×1%, 输入噪声峰峰值×2)（K-PROT-108）;
    - 告警阈值 ≤ 保护点 − 设计余量（K-PROT-002）;
    - 保护功能完整性（OVP/OCP/OPP/OTP/SCP 同时声明）（K-PROT-107）。
  measures: [T-OTP, T-HYSTERESIS, T-JTEMP, T-THERMALCHAMBER]
  rules: [K-PROT-107, K-PROT-108, K-PROT-002]
  standards: [IEC 61204]
  references:
    - https://zhuanlan.zhihu.com/p/656149742
    - https://www.szcpet.com/newsinfo/2563359.html
    - https://bbs.csdn.net/weixin_42523326/article/details/100463955
  retrieved: "2026-10-12"

- method_id: M-SCP
  zh: 短路保护测试
  en: Short Circuit Protection Test
  aliases: [短路保护测试, SCP测试]
  category: protection
  definition: 将输出直接短接（阻抗 <0.1Ω）, 验证电源进入保护状态并锁定/重试, 且不损坏接口线缆与器件。
  parameters:
    - 负载：正常带载后切换至短路（阻抗 <0.1Ω）
    - 输入：额定
    - 短路时长：按规格（典型 µs~ms 级动作）
  instruments:
    - 电子负载（支持短路模式）或专用短路开关/接触器
    - 示波器+电流探头（记录短路电流波形）
  interfaces:
    - 输出端子 V+/V− 经电子负载短路模式短接
    - 示波器+电流探头接入输出回路
  metrics:
    - 短路保护动作时间（µs）
    - 短路电流峰值/折返电流 I_sc（A）
    - 短路解除后恢复时间与恢复行为
  procedure:
    - 用低阻开关/继电器将任一路输出直接短路（输出阻抗 <0.1Ω 即判短路）;
    - 记录短路电流波形与保护动作时间（典型 µs 级）;
    - 移除短路, 观察恢复行为（自动打嗝恢复或需复位）;
    - 检查接口/线缆/器件有无熔断或损伤。
  criteria:
    - 任一路输出阻抗 <0.1Ω 时必须进入关闭并锁定保护状态, 不应损坏接口线缆（K-PROT-104）;
    - 折返式保护短路态电流 I_sc 应低于恒流限流点（典型 0.2~0.5 倍）（K-PROT-106）。
  measures: [T-SCP, T-FOLDBACK, T-HICCUP]
  rules: [K-PROT-104, K-PROT-106]
  standards: [IEC 61204]
  references:
    - https://www.fcpowerup.com/how-do-i-test-power-supplies
    - http://welissom.com/html/cn/xingyezixun/4561.html
  retrieved: "2026-10-12"

- method_id: M-OVP
  zh: 过压保护测试
  en: Over Voltage Protection Test
  aliases: [过压保护测试, OVP测试]
  category: protection
  definition: 升高输出电压（或施加外部电压）使输出超过保护点, 测量保护触发点与动作方式（钳位/关断）。
  parameters:
    - 输出：缓慢升高（内部设定或外部注入电压）
    - 负载：额定
    - 触发方式：外部电压源注入或破坏反馈
  instruments:
    - 可调直流源（外部注入过压）
    - 示波器（记录保护动作波形）
    - 数字万用表
  interfaces:
    - 外部电压源经二极管/隔离接入输出端子
    - 输出端子 V+/V− 接电子负载
    - 示波器接输出端
  metrics:
    - OVP 保护点（V，±5% 容差带）
    - 保护动作时间（ms 级）
    - 跟踪式 OVP 系数（宽可调电源）
  procedure:
    - 缓慢升高输出电压设定/施加外部电压, 记录输出超过保护点时的动作;
    - 对宽输出可调电源验证跟踪式 OVP（保护点随设定值变化）;
    - 记录保护点与标称值的偏差与容差带。
  criteria:
    - OVP 保护点实测值落在标称 ±5% 容差带内（K-PROT-111）;
    - 宽输出可调电源须采用跟踪式 OVP（保护点 = 设定值 × 系数）（K-PROT-101）。
  measures: [T-OVP]
  rules: [K-PROT-101, K-PROT-111]
  standards: [IEC 61204]
  references:
    - https://zhuanlan.zhihu.com/p/699450936
    - https://www.szwanbo.com/industry-news/539386.html
  retrieved: "2026-10-12"

- method_id: M-HIPOT
  zh: 耐压(电介质强度)测试
  en: Dielectric Strength (Hi-Pot) Test
  aliases: [耐压测试, 高压测试, 电介质强度测试]
  category: safety
  definition: 对绝缘系统施加高于工作电压的试验电压并保持规定时间, 观测击穿/闪络与漏电流, 验证绝缘强度。
  parameters:
    - 试验电压：按绝缘类型选择（如 2500Vdc 基本/4000Vdc 加强）
    - 保持时间：1min
    - 漏电流截止值：如 5mA
    - 升压速率：≤500V/s
  instruments:
    - 耐压测试仪（AC/DC，漏电流可整定 0.5~5mA）
    - 校准电阻（700kΩ 验证报警点）
    - 隔离/安全防护设施
  interfaces:
    - 输入 L/N 短接 → 高压输出线
    - 输出/外壳 → 回路接地线（PE）
    - 测试后放电回路
  metrics:
    - 试验电压（kVac/kVdc）
    - 漏电流读数（mA，≤截止值）
    - 判定：无击穿/闪络
  procedure:
    - 上电前预测试：先测绝缘电阻/接地阻抗排除短路故障;
    - 输入火零线短接接高压输出, 输出/PE 接地; 耐压仪设置漏电流截止值（如 5mA）;
    - 按标准选择试验电压（如基本绝缘/加强绝缘对应等级, 或按“工作电压×2+1000V”公式）, 升压并保持 1min;
    - 观察有无击穿、闪络与漏电流读数; 直流耐压后按规定放电。
  criteria:
    - 基本绝缘（输入对地）2500Vdc、加强绝缘（输入对输出）4000Vdc 试验电压下无击穿闪络（K-SAF-101）;
    - 试验回路须具备过流/过压保护, 被测件与接地导体保持规定间距, 按规定升压（K-SAF-102）;
    - 安规测试顺序：先绝缘电阻/接地预测试, 再耐压（K-SAF-109）。
  measures: [T-HIPOT, T-Y1Y2, T-SAFSEQ]
  rules: [K-SAF-101, K-SAF-102, K-SAF-109]
  standards: [IEC 62368-1, GB 9706.1]
  references:
    - https://www.cnblogs.com/datacenter/p/18350186
    - https://cloud.tencent.com/developer/article/2464362
    - https://www.eet-china.com/mp/a119666.html
    - https://gwinstek.com.cn/down/259/%E8%80%90%E7%94%B5%E5%8E%8B%E6%B5%8B%E8%AF%95GPT%E7%99%BD%E7%9A%AE%E4%B9%A6_cn.pdf
  retrieved: "2026-10-12"

- method_id: M-INSULATION-RES
  zh: 绝缘电阻测试
  en: Insulation Resistance Test
  aliases: [绝缘电阻测试, 绝缘测试]
  category: safety
  definition: 用绝缘电阻表在带电部件与外壳/输出之间施加直流电压, 测量绝缘电阻值。
  parameters:
    - 试验电压：500Vdc
    - 环境：相对湿度 90%
    - 读数：待稳定后记录
  instruments:
    - 绝缘电阻表/兆欧表（500V 档，量程 ≥ 250MΩ）
  interfaces:
    - L 端 → 输入短接端
    - E 端 → 外壳/输出
    - G 端（屏蔽端）按需
  metrics:
    - 绝缘电阻（MΩ，≥2MΩ 限值）
    - 读数稳定时间
  procedure:
    - 断电状态, 绝缘电阻表（500Vdc）接输入短接端与外壳（或输出）之间;
    - 待读数稳定后记录绝缘电阻值（相对湿度 90% 条件下）;
    - 与限值比对; 测试后按规定放电。
  criteria:
    - 绝缘电阻 ≥ 2MΩ（500Vdc, 相对湿度 90%）（K-SAF-001）;
    - 属安规预测试项：先于耐压执行（K-SAF-109）。
  measures: [T-INSULRES]
  rules: [K-SAF-001, K-SAF-109]
  standards: [IEC 62368-1]
  references:
    - https://cloud.tencent.com/developer/article/2464362
    - https://www.cnblogs.com/datacenter/p/18350186
  retrieved: "2026-10-12"

- method_id: M-GROUND-BOND
  zh: 接地连续性(接地阻抗)测试
  en: Ground Bond (Earth Continuity) Test
  aliases: [接地电阻测试, 接地连续性测试]
  category: safety
  definition: 用大电流低电阻法测量保护接地端子与可触及金属外壳之间的阻抗, 验证接地保护有效性。
  parameters:
    - 测试电流：≥10A（典型 25A）
    - 开路电压：≤12V
    - 测试时间：按规定（如 1min 内读数）
  instruments:
    - 接地电阻测试仪（大电流低电阻法，分辨率 mΩ 级）
    - 四线制电压取样线
  interfaces:
    - 电流夹接保护接地端子与可触及金属外壳
    - 电压取样线夹在内侧（消除接触电阻）
  metrics:
    - 接地阻抗（mΩ/Ω，<0.1Ω 限值）
  procedure:
    - 使用接地电阻测试仪, 输出大电流（≥10A）、开路电压 ≤12V（50/60Hz）;
    - 接保护接地端子与可触及金属外壳, 读取阻抗;
    - 记录阻抗值并比对限值。
  criteria:
    - 保护接地端子与外壳间接地阻抗 < 0.1Ω, 须用大电流（≥10A）低电阻法测量（K-SAF-002/108）。
  measures: [T-GNDCONT]
  rules: [K-SAF-002, K-SAF-108]
  standards: [IEC 62368-1]
