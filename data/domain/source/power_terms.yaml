  - term_id: T-REMOTEOFF
    zh: 遥控关机信号
    en: Remote Power Off
    abbr: REMOTE_POWER_OFF
    category: communication
    definition: >-
      遥控关机输入 (引脚名 REMOTE_POWER_OFF, 中文"遥控关机"): 高电平有效 (应复位所有输出);
