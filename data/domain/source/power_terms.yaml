  - term_id: T-N10VFAULT
    zh: N10V 在位检测信号
    en: N10V Presence / Fault Detect Signal
    abbr: N10V_FAULT
    category: communication
    definition: >-
      单板在位检测信号 (引脚名 N10V_FAULT): 低电平有效 (正常模式高电平、异常模式低电平);
      低电平 0~0.8V、高电平 2.8~3.6V, 灌/拉电流 ≤4mA; 50V 输出关闭时低电平持续时间须 >200µs。
