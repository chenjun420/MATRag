    related_rules: [K-PWR-110, K-PWR-111]
    source: {kind: spec_table, name: "PA601-D54A §4.3.2 输出特性 / CY0177 表2 输出规格 / GDC800T5054-UC §4.3 输出特性 (输出电压)", url: "", retrieved: "2026-10-14"}

  - term_id: T-OUTCURR
    zh: 输出电流
    en: Output Current
    abbr: ""
    category: output
    definition: >-
      电源输出端提供的电流; 规格书给出最大/最小负载电流, 恒流(CC)模式下由限流设定值决定, 低于最小负载时的稳定性见负载条件。
    aliases: [最大电流, 额定输出电流]
    properties: [output_current]
    related_rules: [K-PWR-127]
    source: {kind: spec_table, name: "CY0177 表2 输出规格 (最大电流) / PA601-D54A §4.3.2 / GDC800T5054-UC §4.3 输出特性 (输出电流)", url: "", retrieved: "2026-10-14"}

  - term_id: T-OUTPWR
    zh: 输出功率
    en: Output Power
    abbr: ""
    category: output
    definition: >-
      电源输出端可提供的功率 (Pout = Vout × Iout); 额定/最大输出功率是选型、并机均流与效率判定的基准量。
    aliases: [最大输出功率, 额定输出功率]
    properties: [output_power]
    related_rules: [K-PWR-001]
    source: {kind: spec_table, name: "CY0177 表2 输出规格 (最大输出功率) / GDC800T5054-UC §4.3 输出特性 / PA601-D54A §4.3.2", url: "", retrieved: "2026-10-14"}

  - term_id: T-INPUTCURR
    zh: 输入电流
    en: Input Current
    abbr: ""
    category: input
    definition: >-
      电源输入端的电流; 最大输入电流按最低输入电压与满载效率推算 (Iin = Pout / (η·Vin)), 上电瞬间的短时峰值是浪涌电流。
    aliases: [最大输入电流]
    properties: [input_current]
    related_rules: [K-PWR-003]
    source: {kind: spec_table, name: "GDC800T5054-UC §4.2 输入特性 (最大输入电流) / CY0177、PA601-D54A 输入电流", url: "", retrieved: "2026-10-14"}

  - term_id: T-NOMVOLT
    zh: 标称输入电压范围
    en: Nominal Input Voltage Range
    abbr: ""
    category: input
    definition: >-
      铭牌标注的额定输入电压范围 (如 220Vac±10%、110Vac±10%); 安规认证在该范围内进行, 与可短时承受的更宽工作电压范围区分。
    aliases: [标称输入电压, 铭牌标称电压]
    properties: [input_voltage]
    related_rules: []
    source: {kind: spec_table, name: "PA601-D54A 规格书 §4.2 SR-PA601-D54A-1100 标称输入电压范围", url: "", retrieved: "2026-10-14"}

  - term_id: T-OVERSHOOT
    zh: 输出过冲
    en: Output Overshoot
    abbr: ""
    category: output
    definition: >-
      负载突变或开关机瞬间输出电压/电流偏离稳态的瞬时尖峰; 判定须同时给出过冲幅度(常为额定值百分比)与恢复时间, 过冲过大提示环路相位裕度不足或输出电容失配。
    aliases: [输出电压过冲, 过冲电压, 过冲电流]
    properties: [measured_overshoot_pct, overshoot_limit_pct]
    related_rules: [K-PWR-109]
    source: {kind: websearch, name: "交流稳压电源动态指标的测试方法 (AET) — 过冲幅值/瞬态总恢复时间", url: "https://chinaaet.com/article/101574", retrieved: "2026-10-14"}

  - term_id: T-POWDOWNDELAY
    zh: 掉电延时
    en: Power-Down Delay
    abbr: ""
    category: output
    definition: >-
      掉电告警发出至输出电压跌落到规定下限(如 36V)的时间窗口; 是保持时间在「告警→跌落」区间的可测化, 用于下游完成数据保护与备份切换。
    aliases: [掉电延时功能, 掉电告警延时]
    properties: [hold_up_limit_ms, measured_hold_up_ms]
    related_rules: [K-PWR-114, K-PWR-115]
    source: {kind: spec_table, name: "PA601-D54A 规格书 §4.3.2 SR-PA601-D54A-1218 掉电延时功能 (掉电告警→54V 跌至 36V)", url: "", retrieved: "2026-10-14"}

  - term_id: T-PWRSEQ
    zh: 上下电时序
    en: Power Sequencing
    abbr: ""
    category: dynamics
    definition: >-
      多路输出电源各路的启动/关断顺序与延迟窗口; 错误时序会引起后级器件闩锁、总线争用与浪涌超标, 关断顺序通常取启动顺序的逆序; 常见实现为PGOOD 级联、复位 IC 与模拟/数字定序器。
    aliases: [各路输出上下电时序要求, 上下电时序, 电源定序]
    properties: []
    related_rules: []
    source: {kind: websearch, name: "控制电源启动及关断时序 (DigiKey) / Power-supply sequencing for FPGAs (TI zhct278)", url: "https://www.digikey.cn/zh/articles/controlling-startup-and-shutdown-power-sequences", retrieved: "2026-10-14"}

  - term_id: T-COMMLOSS
    zh: 通讯中断保护
    en: Communication Loss Protection
    abbr: ""
    category: communication
    definition: >-
      通信链路超时(如 120s 未收到有效报文)时的保护策略: 保持或按预设动作关断输出并置告警, 恢复通信后自恢复或需复位, 防止通信故障期间失控运行。
    aliases: [通讯中断, 通信中断]
    properties: []
    related_rules: []
    source: {kind: spec_table, name: "CY0177 规格书 保护功能 (通讯中断 120s 未收报文)", url: "", retrieved: "2026-10-14"}

  - term_id: T-TELEMACC
    zh: 遥测检测精度
    en: Telemetry Accuracy
    abbr: ""
    category: communication
    definition: >-
      遥测(READ_VOUT/READ_IOUT/READ_VIN/温度)读数与真值的允许偏差, 以读数百分比或绝对量给出; 判定须扣除采样链(分压电阻/DCR/分流器)与仪器不确定度, 并覆盖全温度范围。
    aliases: [输入电压检测精度, 输出电压检测精度, 输出电流检测精度, 温度检测精度, 遥测精度]
    properties: [telemetry_error_limit_pct]
    related_rules: [K-TLM-101, K-TLM-105, K-TLM-108]
    source: {kind: websearch, name: "利用 PMBus 数字电源系统管理器进行电流检测 (ADI) — TUE 总非调整误差与读回精度", url: "https://www.analog.com/cn/resources/analog-dialogue/articles/current-sensing-with-pmbus-digital-power-system-managers-part-2.html", retrieved: "2026-10-14"}

  - term_id: T-LOGICLVL
    zh: 逻辑电平
    en: Logic Level
    abbr: ""
    category: communication
    definition: >-
      数字接口信号的高/低电平阈值定义: VIL 为判为低电平的最大输入电压, VIH 为判为高电平的最小输入电压, VOL/VOH 为给定 IOL/IOH 下输出的低/高电平保证值; 互连须保证 VOH ≥ VIH 且 VOL ≤ VIL。
    aliases: [逻辑输入低电平(VIL), 逻辑输入高电平(VIH), 逻辑输出低电平(VOL), 逻辑输出高电平(VOH)]
