  - term_id: T-I2CRESET
    zh: I2C 复位信号
    en: I2C Reset Signal
    abbr: PWR_I2C_RESET
    category: communication
    definition: >-
      I2C 接口复位输入 (引脚名 PWR_I2C_RESET): 高电平有效; 低电平 0~0.8V、高电平 2.8~3.6V;
      有效持续时间须 >700ms; 接地电阻 10kΩ。
    aliases: [PWR_I2C_RESET, I2C复位引脚, I2C复位]
    properties: []
    related_rules: []
    source: {kind: spec_table, name: "GDC800T5054-UC 表0 其他特性 (PWR_I2C_RESET 电压/电流 高低电平) + §引脚定义 (I2C复位引脚)", url: "", retrieved: "2026-10-16"}

  - term_id: T-TELEADJUST
    zh: 遥调
    en: Teleadjustment
    abbr: ""
    category: communication
    definition: >-
      四遥中"遥调"(YT): 由上位机远程下发模拟设定值 (调压/调流/限功率点), 与遥控的开/
      关命令相区分; 须验证设定限幅 (不越硬件保护范围)、回读一致性与响应时延。
    aliases: [遥调功能, 遥调, 远程设定, 远程调压]
    properties: [measured_command_latency_ms, command_latency_limit_ms]
    related_rules: [K-TLM-107, K-TLM-108]
    source: {kind: card, name: "power-knowledge-13 遥测遥信遥控 (四遥定义与设定值下发)", card_id: power-knowledge-13, url: "", retrieved: "2026-10-16"}

  - term_id: T-PGOOD
    zh: 电源正常信号
    en: Power Good Signal
    abbr: ""
    category: communication
    definition: >-
      输出建立后的"电源正常"指示 (PG/PGOOD/PSOK): 常为开漏或 TTL 输出, 高=正常;
      上电时序中常作级联使能信号; 测试关注翻转阈值、相对输出建立的延时与序列顺序。
    aliases: [PGOOD, PG信号, PSOK, 电源正常信号]
    properties: []
    related_rules: []
    source: {kind: websearch, name: "控制电源启动及关断时序 (DigiKey) / Power Good 信号语义", url: "https://www.digikey.cn/zh/articles/controlling-startup-and-shutdown-power-sequences", retrieved: "2026-10-16"}

  - term_id: T-ENABLE
    zh: 使能信号
    en: Enable Signal
    abbr: ""
    category: communication
    definition: >-
      控制电源开关的使能输入 (EN/PSON/REMOTE_EN): 有效电平 (高或低) 由设计决定, 常
      内部上拉; 测试验证使能阈值、去抖与开/关机时序, 以及失效安全默认态 (悬空保持安全)。
    aliases: [PSON, PSON12V#, 使能引脚, 远程使能, 使能控制]
    properties: []
    related_rules: []
    source: {kind: websearch, name: "PSON12V# 低有效使能信号特性 (PAC800D12-B1 技术手册) / 电源遥控开关信号惯例", url: "https://atta.szlcsc.com/upload/public/pdf/source/20211206/DC6554C32C5DB96B4BC7B6DBF62DF968.pdf", retrieved: "2026-10-16"}

  - term_id: T-LEDIND
    zh: 面板指示灯
    en: Panel Indicator
    abbr: ""
    category: general
    definition: >-
      电源面板状态指示 (运行/告警/故障 LED 或显示): 颜色与闪烁语义须与状态定义一致;
      产测验证自检序列、各状态灯态与复位行为 (灯态常为失效安全设计的最后防线)。
    aliases: [指示灯, 状态灯, 运行指示灯, 告警指示灯, LED指示]
    properties: []
    related_rules: []
    source: {kind: websearch, name: "电源模块 LED 状态指示与故障排除 (IBM DataPower 电源模块文档)", url: "https://www.ibm.com/docs/zh/datapower-gateway/11.0.0?topic=appliance-troubleshooting-power-supply-modules", retrieved: "2026-10-16"}

  - term_id: T-DRYCONTACT
    zh: 干接点
    en: Dry Contact
    abbr: ""
    category: communication
    definition: >-
      无源机械触点形式的信号输出 (告警/状态): 与被测电路电气隔离, 常有常开/常闭组合;
      产测验证通断状态与语义一致性 (失效安全: 断电时触点须处于告警态) 与接触电阻。
    aliases: [干接点输出, 干接点, 无源触点]
    properties: [contact_type, contact_resistance_limit]
    related_rules: [K-TLM-111]
    source: {kind: card, name: "power-knowledge-13 遥测遥信遥控 (干接点/光耦接口)", card_id: power-knowledge-13, url: "", retrieved: "2026-10-16"}

  - term_id: T-RELHUMI
    zh: 相对湿度
    en: Relative Humidity
    abbr: ""
    category: environment
    definition: >-
      工作/储存环境的相对湿度条件(如 5%~95%RH 无凝露); 凝露会降低绝缘电阻与爬电裕量, 高湿试验须按无凝露或标准加严条件判定。
    aliases: [工作湿度]
    properties: []
    related_rules: []
    source: {kind: spec_table, name: "PA601-D54A §4.1 / CY0177 / GDC800T5054-UC 表4-1 (相对湿度/工作湿度)", url: "", retrieved: "2026-10-14"}

  - term_id: T-STORETEMP
    zh: 储存温度
    en: Storage Temperature
    abbr: ""
    category: environment
    definition: >-
      非工作状态下允许的环境温度范围(如 -55~125℃); 用于运输与仓储判定, 不得与工作温度混用。
    aliases: [存储温度]
    properties: []
    related_rules: []
    source: {kind: spec_table, name: "PA601-D54A §4.1 SR-PA601-D54A-0200 / CY0177 / GDC800T5054-UC 表4-1 储存温度", url: "", retrieved: "2026-10-14"}

  - term_id: T-OPERTEMP
    zh: 工作温度
    en: Operating Temperature
    abbr: ""
    category: environment
    definition: >-
      电源可正常工作的环境温度范围 TA(如 -40~85℃); 高低温上下限影响降额与启动能力, 须与 PCB 温度 TB 区分。
    aliases: [工作温度范围, 标称工作温度范围, 工作温度(TA)]
    properties: [operating_temp]
    related_rules: [K-THM-003]
    source: {kind: spec_table, name: "PA601-D54A §4.1 / CY0177 / GDC800T5054-UC 表4-1 工作温度(TA)", url: "", retrieved: "2026-10-14"}

  - term_id: T-ALTITUDE
    zh: 海拔高度
    en: Altitude
    abbr: ""
    category: environment
    definition: >-
      工作/运输的海拔上限(如 5000m); 高海拔空气密度低, 散热能力与绝缘强度下降, 电气间隙须按标准(如 IEC 60664-1 表 A.2, 5000m 约 ×1.48)修正。
    aliases: [海拔, 工作海拔高度]
    properties: []
    related_rules: []
    source: {kind: websearch, name: "高电压终端设备的电气间隙与爬电距离解密 (TI, IEC 60664-1 海拔校正)", url: "https://www.ti.com/lit/pdf/nesp013", retrieved: "2026-10-14"}

  - term_id: T-TEMPRATE
    zh: 温度变化速率
    en: Temperature Change Rate
    abbr: ""
    category: environment
    definition: >-
      环境温度变化的最大允许速率(如 ≤1℃/min); 超出会引起热冲击应力、密封失效与结露, 温度循环试验须控制变温速率。
    aliases: [温度变化最大允许速率, 温度变化率]
    properties: []
    related_rules: []
    source: {kind: spec_table, name: "PA601-D54A 规格书 §4.1 SR-PA601-D54A-0203 温度变化最大允许速率", url: "", retrieved: "2026-10-14"}

  - term_id: T-LOADCOND
    zh: 负载条件
    en: Load Condition
    abbr: ""
    category: output
    definition: >-
      电源输出所带负载的档位条件(空载/最小/额定/最大负载); 效率、调整率与稳定性须在各档位分别判定, 低于最小负载时可能进入跳脉冲/突发模式, 纹波与精度随之变化。
    aliases: [最大负载, 最小负载, 最小负载电流, 空载]
    properties: []
    related_rules: [K-PWR-120]
    source: {kind: websearch, name: "如何知道 DC-DC 转换器的最小负载需求 (DigiKey TechForum) / DCDC 轻载工作模式", url: "https://forum.digikey.com/t/dc-dc/43521", retrieved: "2026-10-14"}

  - term_id: T-CAPLOAD
    zh: 容性负载
    en: Capacitive Load
    abbr: ""
    category: output
    definition: >-
      电源输出端允许连接的外部电容总量(如 1000~2000µF, 多路按储能分配); 容性负载过大或 ESR 过高会引起启机不良、过流保护误动或环路振荡, 测试须按规格的电容组合(含陶瓷电容比例)判定。
    aliases: [带容性负载大小, 带容性负载, 容性负载能力]
    properties: [capacitance]
    related_rules: [K-PWR-101]
    source: {kind: websearch, name: "小型 DC/DC 开关电源容性负载的研究 (21ic)", url: "https://www.21ic.com/dc/technical/201807/73134.html", retrieved: "2026-10-14"}

  - term_id: T-DROPOUT
    zh: 输入输出电压降
    en: Dropout Voltage
    abbr: ""
    category: input
    definition: >-
      维持稳压所需的输入与输出电压最小差值(dropout voltage); 输入接近该点时输出失去调整能力并随输入下降, 直通/线性通路尤须校核。
    aliases: [输入输出压降]
    properties: []
    related_rules: []
    source: {kind: websearch, name: "LDO 基础知识 (TI zhcy093) / 在系统中成功运用低压差稳压器 (ADI)", url: "https://www.ti.com.cn/cn/lit/wp/zhcy093/zhcy093.pdf", retrieved: "2026-10-14"}

  - term_id: T-GROUNDING
    zh: 接地方式
    en: Grounding
    abbr: ""
    category: safety
    definition: >-
      电源的接地/共地结构要求: 保护地就近接机壳, 输出地与信号地按规格相互隔离或共地; 影响安规耐压、EMS 与信号完整性。
    aliases: [输出共地方式, 共地方式]
    properties: []
    related_rules: [K-SAF-002]
    source: {kind: spec_table, name: "PA601-D54A §4.3 SR-PA601-D54A-1110 接地方式 / SR-PA601-D54A-1225 输出共地方式", url: "", retrieved: "2026-10-14"}

  - term_id: T-ACOUSTICNOISE
    zh: 噪声
    en: Acoustic Noise
    abbr: ""
    category: mechanical
    definition: >-
      电源工作时产生的可听噪声(风扇、变压器磁致伸缩等), 以规定距离(如 1m)处的声压级 dB 限值判定。
    aliases: [可听噪声, 噪音, 噪声要求, 声学噪声]
    properties: []
    related_rules: []
    source: {kind: spec_table, name: "CY0177 表2 输出规格 (噪声 ≤65dB @1m) / PA601-D54A §4.3 噪声要求", url: "", retrieved: "2026-10-14"}

  - term_id: T-OUTPROTISO
    zh: 输出保护独立性
    en: Output Protection Independence
    abbr: ""
    category: protection
    definition: >-
      多路输出电源保护动作的互不干扰要求: 某一路过压/短路保护不得影响其它路输出, 避免共基准或互锁设计导致的连带关断。
    aliases: [输出保护时其它各路输出之间的相关性, 输出保护相关性]
    properties: []
    related_rules: []
    source: {kind: spec_table, name: "PA601-D54A 规格书 §4.3.2 SR-PA601-D54A-1312 输出保护时其它各路输出之间的相关性", url: "", retrieved: "2026-10-14"}

  - term_id: T-CCACC
    zh: 恒流精度
    en: Constant-Current Accuracy
    abbr: ""
    category: output
    definition: >-
      恒流(CC)模式下输出电流的精度(如 ±5% 额定输出); CV/CC 双模式下须与电压精度分别判定, 由限流设定基准与采样链精度决定。
    aliases: [恒流模式精度]
    properties: []
    related_rules: [K-PWR-112]
    source: {kind: spec_table, name: "CY0177 表2 输出规格 (恒流精度 ±5%, 额定 48V/60V 输出)", url: "", retrieved: "2026-10-14"}

  - term_id: T-INPWR
    zh: 输入功率
    en: Input Power
    abbr: ""
    category: input
    definition: >-
      电源从输入侧吸收的功率: 交流为 输入电压 × 输入电流 × 功率因数
      (Pin = Vin·Iin·PF), 直流为输入电压与输入电流之积; 与输出功率之差
      即损耗。
    aliases: [交流输入功率]
    properties: [input_power]
    related_rules: [K-PWR-003, K-PWR-126]
    source: {kind: spec_table, name: "GDC800T5054-UC §4.5 效率特性 (P_in) / PA601-D54A 整机效率测试 (输入功率)", url: "", retrieved: "2026-10-14"}

  - term_id: T-POWER
    zh: 功率
    en: Electric Power
    abbr: ""
    category: general
    definition: >-
      电功率: 直流为 P = U × I, 交流为 P = U × I × 功率因数; 电源语境下按
      侧别区分为输入功率与输出功率, 二者之比为效率。SI 单位瓦特 (W)。
    aliases: [电功率]
    properties: [power]
    related_rules: [K-ELEC-001, K-PWR-001, K-PWR-125]
    source: {kind: standard, name: "GB/T 2900.1-2008《电工术语 基本术语》有功功率/功率(直流)", url: "https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=00825B0E95FFA38A3F03F66AB6220693", retrieved: "2026-10-14"}

  - term_id: T-RESISTANCE
    zh: 电阻
    en: Resistance
    abbr: R
    category: general
    definition: >-
      导体对电流的阻碍作用, SI 单位欧姆 (Ω); 直流电路遵循欧姆定律
      R = U / I, 纯电阻电路功耗 P = I²R = U²/R。产测语境下另有绝缘电阻、
      接触电阻、等效串联电阻 (ESR) 等专用概念, 见相应术语。
    aliases: [电阻器]
    properties: [resistance]
    related_rules: [K-ELEC-002, K-ELEC-003, K-ELEC-004, K-ELEC-005]
    source: {kind: standard, name: "GB/T 2900.1-2008《电工术语 基本术语》电阻/欧姆定律", url: "https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=00825B0E95FFA38A3F03F66AB6220693", retrieved: "2026-10-15"}

  - term_id: T-VDIP
    zh: 电压暂降与短时中断
    en: Voltage Dip & Short Interruption
    abbr: ""
    category: emc
    definition: >-
      供电电压有效值暂时跌落到规定阈值以下 (暂降) 或跌到接近零 (短时中断) 的
      抗扰度试验现象, 另有电压变化 (升高/降低) 试验; 按 GB/T 17626.11 以
      %Ut 试验等级与持续时间组合施加, 按 A/B/C 性能判据验收。
    aliases: [电压暂降, 电压短时中断, 电压变化]
    properties: []
    related_rules: []
    source: {kind: standard, name: "GB/T 17626.11-2008《电磁兼容 试验和测量技术 电压暂降、短时中断和电压变化的抗扰度试验》", url: "https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=699499AA346E452C17CD1E13EDF31D47", retrieved: "2026-10-17"}

  - term_id: T-SURGE
    zh: 浪涌抗扰度
    en: Surge Immunity
    abbr: ""
    category: emc
    definition: >-
      设备对开关瞬态与雷击瞬态过电压 (浪涌) 的抗扰度试验: 以 1.2/50μs 电压波
      (8/20μs 电流波) 经耦合网络施加差模/共模干扰, 按 GB/T 17626.5 以试验等级
      与性能判据 A/B/C 验收; 电源端口防护须与放电管/压敏器件配合。
    aliases: [浪涌抗扰性, 浪涌试验, 浪涌]
    properties: []
    related_rules: []
    source: {kind: standard, name: "GB/T 17626.5-2019《电磁兼容 试验和测量技术 浪涌(冲击)抗扰度试验》", url: "https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=534499018FB30E7FC5E646F89937B3A8", retrieved: "2026-10-17"}

  - term_id: T-IP
    zh: 外壳防护等级
    en: Ingress Protection Rating (IP Code)
    abbr: IP
    category: mechanical
    definition: >-
      由外壳对固体异物与水的防护能力分级 (IP 代码): 第一位特征数字表示防固体异物/防触及
      (0~6), 第二位数字表示防水 (0~8), 如 IP54 = 防尘 + 防溅水; 整机 (含接口) 须覆盖
      声明等级, 试验按 GB/T 4208 执行, 试验后不影响绝缘与安全性能。
    aliases: [防护等级, 防水防尘等级, 防水防尘, IP 等级]
    properties: []
    related_rules: []
    source: {kind: standard, name: "GB/T 4208-2017 外壳防护等级（IP代码）", url: "https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=09CCED55688D4116ED89659C1E7526F8", retrieved: "2026-10-17"}

  - term_id: T-ROHS
    zh: 有害物质限用
    en: Restriction of Hazardous Substances (RoHS/HSF)
    abbr: RoHS
    category: standards
    definition: >-
      电子电气产品中有害物质 (铅/汞/镉/六价铬/多溴联苯/多溴二苯醚及邻苯二甲酸酯类)
      的限量要求与合格评定: 中国 RoHS 按 GB/T 26572 及其修改单执行, 产品须满足 HSF
      要求并有绿色环保标识等披露。
    aliases: [环保要求, HSF, 有害物质限用, 绿色环保标识]
    properties: []
    related_rules: []
    source: {kind: standard, name: "GB/T 26572-2011 电子电气产品中限用物质的限量要求", url: "https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=709EEDE5BF49ACDD34DB85F466D715E8", retrieved: "2026-10-17"}

  - term_id: T-ENVTEST
    zh: 环境与可靠性试验
    en: Environmental & Reliability Test
    abbr: ""
    category: environment
    definition: >-
      按 GB/T 2423 系列与产品环境试验规范对电源进行的项目试验族: 温度类
      (低温/高温工作与存储、温度变化、高低温循环)、湿热类 (恒定湿热、交变湿热、
      凝露、湿尘)、机械类 (振动、冲击、跌落、堆码)、腐蚀与低气压类 (盐雾、
      低气压) 以及 HALT 等健壮性试验; 判据为试验后电气性能正常、外观不损坏。
    aliases: [环境试验, 低温工作试验, 低温工作实验, 高温工作试验, 高温工作实验, 低温存储, 高温存储, 高低温循环, 恒定湿热, 交变湿热, 温度变化试验, 振动试验, 冲击试验, 跌落试验, 运输振动, 运输冲击, 运输跌落, 堆码, 凝露试验, 湿尘试验, 油污试验, 盐雾试验, 低气压试验, 开关机试验, 开关电试验, HALT]
    properties: []
    related_rules: []
    source: {kind: standard, name: "GB/T 2423 系列《电工电子产品环境试验 第2部分: 试验方法》(低温/高温/恒定湿热/盐雾/低气压等)", url: "https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=E7F0B1D2B9A9E03614018F0AEEE98E02", retrieved: "2026-10-17"}
