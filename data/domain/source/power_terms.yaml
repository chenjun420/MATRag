  - term_id: T-OUTVOLT
    zh: 输出电压
    en: Output Voltage
    abbr: ""
    category: output
    definition: >-
      电源输出端的稳压电压; 规格书以范围(如 40~75V)、可调节范围与整定值形式给出, 判定指标包括稳压精度、线性/负载调整率与动态过冲。
    aliases: [输出电压范围, 输出电压可调节范围, 输出电压整定值, 输出整定电压]
