[project]
name = "matrag"
version = "0.1.0"
description = "电子产品产测 RAG + 产测软件开发/调测 Agent 服务组（semantica 引擎）"
requires-python = ">=3.12,<3.14"
dependencies = [
    # 解析层：单元格几何提取
    "pymupdf>=1.24",
    # Provider Gateway：LLM/Embedding 走 OpenAI 兼容端点（MaaS）
    "openai>=1.30",
    "httpx>=0.27",
    # gateway 服务面（MCP over HTTP；mcp 2.x 将 FastMCP 改名 MCPServer，pin <2）
    "mcp>=1.2,<2",
    # 基座
    "pydantic>=2.9",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    # RAG 引擎（semantica 0.7.x；pin 小版本防漂移）
    "semantica>=0.7,<0.8",
    "semantica[vectorstore-sqlite]>=0.7,<0.8",
    "semantica[shacl]>=0.7,<0.8",
    "semantica[parse-pdf]>=0.7,<0.8",
    # 中文分词（关键词腿 dev 环境）
    "jieba>=0.42",
    "rank_bm25>=0.2.2",
    # 域知识源导入（csv/json 解析用；rules.yaml 为 YAML）
    "orjson>=3.10",
    # Agent 工具循环（原生 tool calling；Pydantic AI 2.x）+ 官方 capability/Harness 库
    "pydantic-ai-slim[openai]>=2.56,<3",
    "pydantic-ai-harness[code-mode,skills]>=0.56,<0.57",
    # LLM 生成脚本沙箱（Rust 解释器，无文件/网络/环境变量访问；资源限额强制）
    "pydantic-monty>=1.1,<2",
    # 规则表达式求解（替换自研 AST 反解；后续扩展一般方程求解）
    "sympy>=1.14,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

# scripts/demo_e2e_simulation.py 在字符串模板 (_SIM_DRIVER_SRC) 里嵌入
# `from ate_platform.drivers.examples.dmm import DMMAbstraction` 等跨仓 import
# （设计内 demo 验证路径, 见 architecture-upgrade-completion-2026-10-18.md §9
# 「已知跨仓豁免清单」）；CI 严格 E402/F401 会误报, 此处显式白名单豁免。
[tool.ruff.lint.per-file-ignores]
"scripts/demo_e2e_simulation.py" = ["E402", "F401", "I001"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
